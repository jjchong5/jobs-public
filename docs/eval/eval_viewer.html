forms through their entire product life-cycle.\n\nWHAT YOU'LL DO\n\nDesign and implement trusted safe navigation, collision avoidance, and situational awareness systems that balance constraints, restrictions and requirements in a multi-stakeholder environment\n\nDesign and implement scalable sub-systems including sensor processing, perception, tracking, motion planning, health management, anomaly detection, simulation, testing fixtures, and vehicle interfaces\n\nContribute to the design and development of existing software components across Anduril, with the aim of developing components that are re-usable across multiple Anduril product lines\n\nUtilize advanced techniques in computer vision, sensor fusion, and machine learning to enhance perception and planning capabilities of Anduril vehicles\n\nConduct thorough testing and validation of perception and planning algorithms through development and use of simulation and analysis of data from real-world experiments, including evolving the data analysis tooling.\n\nCollaborate with cross-functional teams, including software engineers, mechanical engineers, and systems engineers, to ensure effective system integration and testing\n\nTravel to co-locate with end-users and/or other teams up to 20% of the time\n\nREQUIRED QUALIFICATIONS\n\nBachelor’s degree in Robotics, Mechatronics, Computer Science, Engineering, a relevant field, or equivalent experience\n\nExperienced and proficient in C++ and/or Python software development\n\nFamiliarity with autonomous vehicle hardware and sensors such as radar, sonar, LIDAR, and cameras\n\nDemonstrated knowledge of at least one of: computer vision, sensor fusion, SLAM, motion planning, machine learning\n\nExperience in a senior perception or planning role for the delivery of a robotic system\n\nCapacity to act as the technical owner for a system, including stakeholder engagement, requirements definition, roadmap management, team co-ordination, design, implementation, sustainment and evolution\n\nAbility to collaborate with stakeholders to define and implement robust validation and verification strategies for perception and planning modules\n\nCapacity to learn and grow individually, while mentoring junior team members effectively, building team cohesion and capacity\n\nEligible to obtain and maintain an active U.S. Secret security clearance\n\nPREFERRED QUALIFICATIONS\n\nExperience with autonomous systems in the ground, air, maritime or space domains\n\nExperience with simulation tools and frameworks, such as Gazebo, Unity, or Unreal Engine, for algorithm validation and testing\n\nKnowledge of safety standards and certification processes for autonomous systems\n\nFamiliarity with System Engineering concepts\n\nAnduril is an equal-opportunity employer, and we encourage candidates from all backgrounds to apply. If you are someone passionate to work on problems that matter, we’d love to hear from you!\nUS Salary Range\n$220,000\n—\n$292,000 USD\nThe salary range for this role is an estimate based on a wide range of compensation factors, inclusive of base salary only. Actual salary offer may vary based on (but not limited to) work experience, education and/or training, critical skills, and/or business considerations. Highly competitive equity grants are included in the majority of full time offers; and are considered part of Anduril's total compensation package. Additionally, Anduril offers top-tier benefits for full-time employees, including:\n \n\n \n\nBenefits\n\nAt Anduril, we invest in our people. Our comprehensive, competitive benefits package (available at little to no cost to employees) ensures you’re supported in health, recovery, and whatever comes next. \nFor more information, \nExplore Our Benefits\n.\n\n \n\nProtecting Yourself from Recruitment Scams\n\nAnduril is committed to maintaining the integrity of our Talent acquisition process and the security of our candidates. We've observed a rise in sophisticated phishing and fraudulent schemes where individuals impersonate Anduril representatives, luring job seekers with false interviews or job offers. These scammers often attempt to extract payment or sensitive personal information.\n\nTo ensure your safety and help you navigate your job search with confidence, please keep the following critical points in mind:\n\nNo Financial Requests: \nAnduril will never solicit payment or demand personal financial details (such as banking information, credit card numbers, or social security numbers) at any stage of our hiring process. Our legitimate recruitment is entirely free for candidates.\n\nPlease always verify communications:\n\nDirect from Anduril: If you receive an email from one of our recruiters, it will \nonly\n come from an \n@anduril.com\n address.\n\nVia Agency Partner: If contacted by a recruiting agency for an Anduril role, their email will clearly identify their agency. If you suspect any suspicious activity, please verify the agency's authenticity by reaching out to \ncontact@anduril.com\n. \n\nExercise Caution with Unsolicited Outreach:\n If you receive any communication that appears suspicious, contains grammatical errors, or makes unusual requests, do not engage. Always confirm the sender's email domain is @anduril.com before providing any personal information or clicking on links.\n\nWhat to Do If You Suspect Fraud:\n Should you encounter any questionable or fraudulent outreach claiming to be from Anduril, please report it immediately to \ncontact@anduril.com\n. Your proactive caution is invaluable in protecting your personal information and upholding the security and trustworthiness of our recruitment efforts.\n\n \n\nData Privacy\n\nTo view Anduril's candidate data privacy policy, please visit \nhttps://anduril.com/applicant-privacy-notice/\n.\n \n\n \n\nBy submitting your application, you consent to Anduril Industries using a third-party service provider to conduct pre-employment risk, integrity, and due diligence screening and assessing potential risks as part of your application process. This third-party service provider provides risk-intelligence services that may include analysis of sanctions and watchlists, adverse media, public-record information, and other lawful open-source or commercial data sources. This third-party service provider does not act as a consumer reporting agency. Use of this provider helps to ensure compliance with applicable laws and protect technology, intellectual property, and organizational security.", "has_role_fields": true, "auto": {"category": "job", "role_type": "robotics software engineer", "seniority": "senior", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "government_defense", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 15, "dbid": 28152, "bucket": "Job", "title": "Tracking Software Engineer, Space", "source": "greenhouse", "location": "Washington, District of Columbia, United States", "url": "https://boards.greenhouse.io/andurilindustries/jobs/5114861007?gh_jid=5114861007", "raw": "Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of systems is powered by Lattice OS, an AI-powered operating system that turns thousands of data streams into a realtime, 3D command and control center. As the world enters an era of strategic competition, Anduril is committed to bringing cutting-edge autonomy, AI, computer vision, sensor fusion, and networking technology to the military in months, not years.\nABOUT THE TEAM\n\nAnduril's Space team is dedicated to expanding our AI-powered capabilities into the final frontier, enhancing Space Domain Awareness, Space Control, and Command and Control for U.S. military and allied partners. We're developing fully integrated hardware and software systems, including Lattice for Space Missions and modular payloads, to address growing threats in space and ensure our Guardians maintain a decisive advantage in this contested war-fighting domain.\n\nABOUT THE JOB\n\nWe are looking for a Tracking Software Engineer to join our rapidly growing team in Washington DC. In this role, you will be responsible for developing 2D and 3D tracking algorithms that maintain custody of space objects, processing sensor detections and messages into actionable tracks for space situational awareness missions. You will design and implement multi-target tracking systems using advanced state estimation and data association techniques, develop physics-based models to validate performance, and work closely with software teams to deploy your algorithms into operational systems. This will require deep expertise in tracking algorithms, state estimation (Kalman filtering), data association methods (JPDA, MHT), proficiency in MATLAB, Python, and C++, and experience with modeling and simulation. If you are someone who enjoys solving challenging tracking problems involving clutter, maneuvering targets, contested sensing environments, and real-time mission constraints then this role is for you.\n\nWHAT YOU’LL DO\n\nPerform systems engineering and algorithm development tasks supporting space and missile defense tracking missions\n\nDesign and implement advanced object tracking and state estimation algorithms, including track initiation, maintenance, correlation, and termination\n\nDevelop and evaluate multi-target tracking and multi-sensor fusion approaches for EO/IR, RF, or hybrid sensor architectures\n\nImplement advanced data association techniques including JPDA (Joint Probabilistic Data Association), MHT (Multiple Hypothesis Tracking), nearest neighbor, and track-to-track fusion methods\n\nApply and refine data association techniques, such as: nearest neighbor and probabilistic association; Joint Probabilistic Data Association (JPDA); Multiple Hypothesis Tracking (MHT); and track-to-track fusion methods\n\nBuild physics-based models and conduct modeling and simulation including Monte Carlo analysis, recorded sensor playback, and hardware-in-the-loop testing to validate tracking performance\n\nConduct performance analysis, trade studies, and simulation-based assessments of tracking robustness under challenging conditions (maneuvering targets, clutter, countermeasures, degraded sensing)\n\nCollaborate with software engineers to transition tracking algorithms from MATLAB/Python prototypes to production C/C++ code optimized for real-time operational systems\n\nSupport the systems engineering lifecycle including requirements decomposition, trade studies on tracking approaches, verification and validation planning, and design reviews (SRR, PDR, CDR)\n\nPrepare technical documentation and briefings for design reviews (SRR, PDR, CDR) and customer engagements\n\nREQUIRED QUALIFICATIONS\n\nCurrently possesses and is able to maintain an active U.S. Secret security clearance\n\nBachelor's degree or higher in Electrical Engineering, Computer Engineering, Aerospace Engineering, Applied Mathematics, Physics, Computer Science, or related technical field\n\n5+ years of experience designing, implementing, and testing multi-target tracking algorithms for aerospace, defense, or autonomous systems\n\nStrong theoretical and practical experience with state estimation techniques, including Kalman Filters (EKF, UKF), multi-target tracking concepts, and Interacting Multiple Model (IMM) filters\n\nExperience developing tracking algorithms that handle track initiation, maintenance, correlation, and termination in operational systems\n\nProficiency in algorithm development using MATLAB and/or Python with demonstrated experience transitioning algorithms to C++ for production deployment\n\nExperience with modeling, simulation, and testing workflows including Monte Carlo analysis, sensor data playback, or hardware-in-the-loop environments\n\nAbility to work collaboratively with software engineers, systems engineers, and test teams to integrate tracking algorithms into operational systems\n\nPREFERRED QUALIFICATIONS\n\nAdvanced degree (MS or PhD) in Engineering, Physics, Applied Mathematics, or related technical field\n\nExperience in one or more of the following domains: missile defense or space systems; EO/IR or RF sensors; kill vehicles, interceptors, or countermeasures\n\nExperience handling challenging tracking scenarios including track fragmentation, ghost tracks, sensor outages, and high-clutter environments\n\nFamiliarity with real-time system constraints, embedded systems, or edge compute optimization\n\nDemonstrated experience working within the systems engineering design cycle, including requirements decomposition and traceability, algorithm design and trade studies, verification and validation (V&V;), and documentation and design reviews (SRR, PDR, CDR)\n\nExperience with MBSE tools (Cameo, Rhapsody, DOORS)\n\nUS Salary Range\n$166,000\n—\n$220,000 USD\nThe salary range for this role is an estimate based on a wide range of compensation factors, inclusive of base salary only. Actual salary offer may vary based on (but not limited to) work experience, education and/or training, critical skills, and/or business considerations. Highly competitive equity grants are included in the majority of full time offers; and are considered part of Anduril's total compensation package. Additionally, Anduril offers top-tier benefits for full-time employees, including:\n \n\n \n\nBenefits\n\nAt Anduril, we invest in our people. Our comprehensive, competitive benefits package (available at little to no cost to employees) ensures you’re supported in health, recovery, and whatever comes next. \nFor more information, \nExplore Our Benefits\n.\n\n \n\nProtecting Yourself from Recruitment Scams\n\nAnduril is committed to maintaining the integrity of our Talent acquisition process and the security of our candidates. We've observed a rise in sophisticated phishing and fraudulent schemes where individuals impersonate Anduril representatives, luring job seekers with false interviews or job offers. These scammers often attempt to extract payment or sensitive personal information.\n\nTo ensure your safety and help you navigate your job search with confidence, please keep the following critical points in mind:\n\nNo Financial Requests: \nAnduril will never solicit payment or demand personal financial details (such as banking information, credit card numbers, or social security numbers) at any stage of our hiring process. Our legitimate recruitment is entirely free for candidates.\n\nPlease always verify communications:\n\nDirect from Anduril: If you receive an email from one of our recruiters, it will \nonly\n come from an \n@anduril.com\n address.\n\nVia Agency Partner: If contacted by a recruiting agency for an Anduril role, their email will clearly identify their agency. If you suspect any suspicious activity, please verify the agency's authenticity by reaching out to \ncontact@anduril.com\n. \n\nExercise Caution with Unsolicited Outreach:\n If you receive any communication that appears suspicious, contains grammatical errors, or makes unusual requests, do not engage. Always confirm the sender's email domain is @anduril.com before providing any personal information or clicking on links.\n\nWhat to Do If You Suspect Fraud:\n Should you encounter any questionable or fraudulent outreach claiming to be from Anduril, please report it immediately to \ncontact@anduril.com\n. Your proactive caution is invaluable in protecting your personal information and upholding the security and trustworthiness of our recruitment efforts.\n\n \n\nData Privacy\n\nTo view Anduril's candidate data privacy policy, please visit \nhttps://anduril.com/applicant-privacy-notice/\n.\n \n\n \n\nBy submitting your application, you consent to Anduril Industries using a third-party service provider to conduct pre-employment risk, integrity, and due diligence screening and assessing potential risks as part of your application process. This third-party service provider provides risk-intelligence services that may include analysis of sanctions and watchlists, adverse media, public-record information, and other lawful open-source or commercial data sources. This third-party service provider does not act as a consumer reporting agency. Use of this provider helps to ensure compliance with applicable laws and protect technology, intellectual property, and organizational security.", "has_role_fields": true, "auto": {"category": "job", "role_type": "tracking software engineer", "seniority": "mid", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "government_defense", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.5}}, {"seq": 16, "dbid": 28456, "bucket": "Job", "title": "Electromechanical Technician (Starshield)", "source": "greenhouse", "location": "Hawthorne, CA", "url": "https://boards.greenhouse.io/spacex/jobs/8569955002?gh_jid=8569955002", "raw": "SpaceX was founded under the belief that a future where humanity is out exploring the stars is fundamentally more exciting than one where we are not. Today SpaceX is actively developing the technologies to make this possible, with the ultimate goal of enabling human life on Mars.\nELECTROMECHANICAL TECHNICIAN (STARSHIELD)\nStarshield leverages SpaceX's Starlink technology and launch capability to support national security efforts. While Starlink is designed for consumer and commercial use, Starshield is designed for government use, with an initial focus on three areas: Earth observation, communications, and hosted payloads. Designed to meet diverse mission requirements, Starshield satellites are capable of integrating a wide variety of payloads, offering unique versatility to users. With the proven ability to iterate rapidly, SpaceX's unique full-stack approach in developing end-to-end systems, from launch vehicles to user terminals, enables the deployment of capabilities at scale with unprecedented speed. Starshield's proliferated low-Earth orbit architecture provides inherent resiliency and constant connectivity to on-orbit assets, while SpaceX's proven rapid launch capability provides expedient and economical access to space.\n\nRESPONSIBILITIES: \n\nFabricate and assemble high-quality, high-reliability electromechanical assemblies\n\nSelf-monitor work progress against area benchmarks and achieve on-time delivery of all work\n\nRead, interpret, and work from drawings as well as from controlled documentation and processes such as:\n\nMechanical drawings, standard dimensioning and tolerancing, and GD&T\n\nAssembly procedures and work instructions\n\nRecord work performed on shop floor management system (ERP) as well as use e-mail (MS Outlook)\n\nPerform verification of flight hardware and document results in a clear, precise, and complete manner\n\nAssist with the development of production processes for first-time production runs\n\nAssist with area efficiency improvement projects\n\nRun tests in HASS/HALT and thermal chambers\n\nSelf-identify quality issues from workmanship, vendor supplied defects, and design issues\n\nBASIC QUALIFICATIONS:\n\nHigh school diploma or equivalency certificate\n\n1+ years of experience using mechanical hand tools\n\nPREFERRED SKILLS AND EXPERIENCE:\n\nAssociate degree\n\n2+ years of professional experience with wire harnesses and/or electronics equipment\n\nExperience in fast-paced production environment working with flight hardware\n\nExperience in a high production environment with hands on experience fabricating harness, electro-mechanical assemblies, or prototype development\n\nAbility to adapt to constant changing work assignments and fast paced work environment\n\nExcellent communication (written and verbal) and teamwork skills\n\nExcellent concentration and attention to detail with outstanding work efficiency and accuracy\n\nADDITIONAL REQUIREMENTS:\n\nMust be willing to work all shifts, overtime, and/or weekends as needed. Estimated start times: 1st shift (5am), 2nd shift (3pm)\n\nStanding for long periods of time, climbing up and down ladders, bending, grasping, sitting, pulling, pushing, stooping, and stretching are generally required to perform the functions of this position\n\nAbility to lift up to 25lbs, unassisted\n\nAbility to distinguish colors\n\nThis position is based in Hawthorne, CA and requires being onsite - remote work not considered\n\nCOMPENSATION AND BENEFITS:\nPay Range:\nLevel 1: $22 - $25\nLevel 2: $25 - $29\nLevel 3: $29 - $35\n\nYour actual level and base salary will be determined on a case-by-case basis and may vary based on the following considerations: job-related knowledge and skills, education, and experience.\n\nBase salary is just one part of your total rewards package at SpaceX. You may also be eligible for long-term incentives, in the form of company stock or long-term cash awards, as well as potential discretionary bonuses and the ability to purchase additional stock at a discount through an Employee Stock Purchase Plan. You will also receive access to comprehensive medical, vision, and dental coverage, access to a 401(k) retirement plan, short and long-term disability insurance, life insurance, paid parental leave, and various other discounts and perks. You may also accrue 3 weeks of paid vacation and will be eligible for 10 or more paid holidays per year. Employees accrue paid sick leave pursuant to Company policy which satisfies or exceeds the accrual, carryover, and use requirements of the law.\nITAR REQUIREMENTS:\n\nTo conform to U.S. Government export regulations, applicant must be a (i) U.S. citizen or national, (ii) U.S. lawful, permanent resident (aka green card holder), (iii) Refugee under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158, or be eligible to obtain the required authorizations from the U.S. Department of State. Learn more about the ITAR \nhere\n.  \n\nSpaceX is an Equal Opportunity Employer; employment with SpaceX is governed on the basis of merit, competence and qualifications and will not be influenced in any manner by race, color, religion, gender, national origin/ethnicity, veteran status, disability status, age, sexual orientation, gender identity, marital status, mental or physical disability or any other legally protected status.\n\nApplicants wishing to view a copy of SpaceX’s Affirmative Action Plan for veterans and individuals with disabilities, or applicants requiring reasonable accommodation to the application/interview process should reach out to \nEEOCompliance@spacex.com\n.", "has_role_fields": true, "auto": {"category": "job", "role_type": "electromechanical technician", "seniority": "junior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "hardware_semiconductor", "remote_type": "other", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 17, "dbid": 30059, "bucket": "Job", "title": "Planning Manager - GOC", "source": "greenhouse", "location": "Remote, USA", "url": "https://careers.withwaymo.com/jobs?gh_jid=7858106", "raw": "Waymo is an autonomous driving technology company with the mission to be the world's most trusted driver. Since its start as the Google Self-Driving Car Project in 2009, Waymo has focused on building the Waymo Driver—The World's Most Experienced Driver™—to improve access to mobility while saving thousands of lives now lost to traffic crashes. The Waymo Driver powers Waymo’s fully autonomous ride-hail service and can also be applied to a range of vehicle platforms and product use cases. The Waymo Driver has provided over ten million rider-only trips, enabled by its experience autonomously driving over 100 million miles on public roads and tens of billions in simulation across 15+ U.S. states.\nWaymo Operations exists to deliver the Waymo Driver to the world. We are a global team building and scaling the world's first and leading autonomous fleet and operations platform. From component sourcing to end customer management, we enable and create value for Waymo through scaled and orchestrated deployment of the Waymo Driver. At Waymo, we are dedicated to building a culture that promotes collaboration and celebration. We value our team members' unique backgrounds, perspectives, and experiences and support and encourage all team members to share their ideas to help Waymo better serve the communities in which we operate.\n\nThis role follows a hybrid work schedule and reports to the Head of Global Operations Planning.\n\n \n\n \n\nYou will:\n\nDesign Scalable Processes:\n Build and own the global framework for Global Operations Center capacity planning, acting as the primary program manager for resource scaling.\n\nNavigate Operational Ambiguity:\n Apply strong business judgment to ensure resource strategies accurately reflect commercial targets (cars, trips, revenue) and real-world operational constraints.\n\nDrive Vendor Accountability:\n Oversee execution across large, cross-organization vendor partnerships, prioritizing structural efficiency models and strict SLA compliance.\n\nShape Executive Narratives:\n Provide critical input to decision-makers by translating complex capacity models into decisive narratives with clear P&L implications.\n\nMitigate Operational Risk:\n Identify risks and advocate for structural fixes and \"principled spending\" rather than relying on temporary resource additions.\n\nValidate Technical Models:\n Periodically perform technical deep-dives to ensure mathematical and capacity models remain transparent, verifiable, and free of \"black box\" assumptions.\n\nArchitect Advanced Models:\n Partner with Product, Engineering, and Data Science to deploy models within centralized planning ecosystems (like Anaplan) to meet evolving requirements.\n\nYou have:\n\nEducational Foundation:\n Bachelor's degree in Business, Economics, Supply Chain, Operations Management, Finance, or equivalent practical experience.\n\nPlanning Expertise:\n 5+ years of experience driving outcomes in capacity planning, commercial operations, S&OP, or strategic program management.\n\nCross-Organizational Leadership:\n Proven ability to drive collaborations with strategic partnership teams and proactively manage dependencies during high-growth phases.\n\nMastery of Communication:\n Exemplary presentation skills with the confidence to establish the \"source of truth\" and influence senior decision-makers.\n\nTooling Fluency:\n Direct expertise building and maintaining capacity models and roadmaps within scaled enterprise platforms like Anaplan.\n\nTechnical Literacy:\n Proficiency with data querying (SQL) and foundational quantitative modeling to effectively guide technical partners and validate data.\n\nWe prefer:\n\nAdvanced Education:\n MBA or Master's degree in Business Administration, Operations, or a related field.\n\nEconomic Impact:\n Proven success managing P&L impacts and unit economics within a high-growth environment.\n\nAV Industry Experience:\n Experience scaling \"human-in-the-loop\" oversight operations for autonomous vehicles while managing complex dependencies.\n\nVendor Management:\n Exposure to BPO (Business Process Outsourcing) practices and aligning external execution with internal capacity plans.\n\nResilience Planning:\n Experience modeling resource requirements for business continuity and large-scale disruption contingency planning.\n\nPlatform Migration:\n Success in migrating complex legacy models out of standard spreadsheets and into integrated enterprise platforms.\n\nIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based employees. Benefits for this role include:\n\nHealth, dental, vision, life, disability insurance\n\nRetirement Benefits: 401(k) with company match\n\nPaid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employment\n\nSick Time: 40 hours/year (statutory, where applicable); 5 days/event (discretionary)\n\nMaternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeks\n\nBaby Bonding Leave: 18 weeks\n\nHolidays: 13 paid days per year\n\n \n\nPlease note that Waymo may not be able to employ remotely in all locations. Please speak with your recruiter about your preferred location for remote work when you begin the interview process. \n\n \nThe expected base salary range for this full-time position across US locations is listed below. Actual starting pay will be based on job-related factors, including exact work location, experience, relevant training and education, and skill level. Your recruiter can share more about the specific salary range for the role location or, if the role can be performed remote, the specific salary range for your preferred location, during the hiring process. \n\nWaymo employees are also eligible to participate in Waymo’s discretionary annual bonus program, equity incentive plan, and generous Company benefits program, subject to eligibility requirements. \nSalary Range\n$159,000\n—\n$196,000 USD", "has_role_fields": true, "auto": {"category": "job", "role_type": "operations manager", "seniority": "mid", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "robotics", "remote_type": "remote", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 18, "dbid": 31607, "bucket": "Job", "title": "Senior Counsel (Regulatory)", "source": "greenhouse", "location": "BLANK,BLANK,Multiple Locations", "url": "https://epicgames.com/careers/jobs/5995038004?gh_jid=5995038004", "raw": "WHAT MAKES US EPIC?\n\nAt the core of Epic’s success are talented, passionate people. Epic prides itself on creating a collaborative, welcoming, and creative environment. Whether it’s building award-winning games or crafting engine technology that enables others to make visually stunning interactive experiences, we’re always innovating.\n\nBeing Epic means being a part of a team that continually strives to do right by our community and users. We’re constantly innovating to raise the bar of engine and game development.\nLEGAL\n\nWhat We Do\n\nEpic's multi-specialized team of attorneys and legal professionals partner across our organization to provide legal solutions as well as consult and inform on the products we build and games we develop.\n\nWhat You'll Do\n\nEpic’s regulatory team advises the company on newly enacted laws and regulations around the world as well as works alongside our Public Policy Team to monitor regulatory developments. Partnering closely with our subject matter experts, Product Counsel and Compliance Team, you will manage the design of compliance programs and educate counsel regarding regulatory requirements. You will also assist with the company’s response to regulatory investigations and requests for information from regulators.\n\nIn this role, you will\n\nAdvise Epic senior management, Product Counsel, the Compliance Team and Legal leadership on key global laws and regulations, including online safety frameworks\n\nLead multi-stakeholder regulatory compliance strategies\n\nProvide legal analysis of legislative and regulatory drafts to the Public Policy team\n\nSupport advocacy and engagement with regulators and trade associations\n\nRespond to global regulatory inquiries and investigations\n\nWhat we're looking for\n\nA qualified attorney with at least 8 years of experience working in regulatory compliance, either within a regulatory body, in-house or at a law firm\n\nExperience handling regulatory enforcement actions brought by regulatory bodies\n\nPrior work and/or substantial knowledge of the tech industry; A good working knowledge of tech or videogames is an advantage\n\nAn individual who is comfortable working in a multi-stakeholder environment, navigating complex issues, driving high-risk/impact projects, and working and making sound judgments and decisions in ambiguous situations where clear guidance is lacking or may not exist\n\nMust be able to work proactively, independently, and reliably under tight timeframes in a fast-paced environment\n\nExcellent interpersonal skills and ability to work collaboratively with a broad range of individuals and teams\n\nThis role is open to multiple locations across the US (including CA, NYC, & WA). \n\nPay Transparency Information\n\nThe expected annual base pay range(s) for this position are detailed below. Each base pay range is relevant only for individuals who are residents of or will be expected to work within the specified locale. Compensation varies based on a variety of factors, which include (but aren’t limited to) things such as skills and competencies, qualifications, knowledge, and experience. In addition to base pay, most employees are eligible to participate in Epic’s generous benefit plans and discretionary incentive programs (subject to the terms of those plans or programs).\n\nEPIC JOB + EPIC BENEFITS = EPIC LIFE\n\nOur intent is to cover all things that are medically necessary and improve the quality of life. We pay 100% of the premiums for both you and your dependents. Our coverage includes Medical, Dental, a Vision HRA, Long Term Disability, Life Insurance & a 401k with competitive match. We also offer a robust mental well-being program through Modern Health, which provides free therapy and coaching for employees & dependents. Throughout the year we celebrate our employees with events and company-wide paid breaks. We offer unlimited PTO and sick time and recognize individuals for 7 years of employment with a paid sabbatical.\n\n#LI-Remote\nNew York City Base Pay Range\n$199,625\n—\n$292,783 USD\nCalifornia Base Pay Range\n$182,989\n—\n$268,384 USD\nWashington Base Pay Range\n$166,354\n—\n$243,986 USD\nABOUT US\n\nEpic Games​ ​is a leading interactive entertainment company. For over 30 years we've been making award-winning games and engine technology that empowers others to make visually stunning games and 3D content that bring environments to life like never before. Epic's award-winning Unreal Engine technology not only provides game developers the ability to build high-fidelity, interactive experiences for PC, console, mobile, and VR, it is also a tool being embraced by content creators across a variety of industries such as media and entertainment, automotive, and architectural design. As we continue to build our Engine technology and develop remarkable games, we strive to build teams of world-class talent.\n\nLike what you hear? Come be a part of something Epic!\n\nEpic Games deeply values diverse teams and an inclusive work culture, and we are proud to be an Equal Opportunity employer. Learn more about our Equal Employment Opportunity (EEO) Policy \nhere\n.\n\nNote to Recruitment Agencies: \nEpic does not accept any unsolicited resumes or approaches from any unauthorized third party (including recruitment or placement agencies) (i.e., a third party with whom we do not have a negotiated and validly executed agreement). We will not pay any fees to any unauthorized third party. Further details on these matters can be found \nhere\n.", "has_role_fields": true, "auto": {"category": "job", "role_type": "regulatory counsel", "seniority": "senior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "consumer_gaming", "remote_type": "other", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 19, "dbid": 33977, "bucket": "Job", "title": "Director of Office of the CEO, Founder in Residence ", "source": "greenhouse", "location": "Menlo Park, CA", "url": "https://job-boards.greenhouse.io/billiontoone/jobs/4707633005", "raw": "A Rare Opportunity to Shape the Future of Genomics\n\nJoin a team of brilliant, passionate innovators determined to transform healthcare. At BillionToOne, we've built a category-defining, publicly traded company on Nasdaq where transparency fuels trust, collaboration drives breakthroughs, and every contribution moves the needle on our mission to make life-changing diagnostics accessible to all. We don't just aim for incremental improvements; we build products that are 10x better than anything that exists today.\n\nOur scientists, engineers, sales executives, and visionaries are united by an unwavering commitment to changing the standard of care in prenatal and cancer diagnostics. This is where cutting-edge science meets human compassion, and every innovation you contribute helps remove the fear of the unknown from some of life's most critical medical moments.\n\nIf you're driven by purpose, energized by innovation, and ready to help shape the future of precision medicine at scale, this is where you belong.\nWe are seeking exceptional entrepreneurial builders to join BillionToOne's newly launched \nFounder in Residence Program\n as a \nDirector, Office of the CEO\n. In this 12 to 18 month program, you will work directly with the CEO and Chief of Staff on the company's highest-priority strategic and operational projects, and graduate into a permanent senior operating role at the Director or Senior Director level.\n\nThis is one of the highest-leverage roles at BillionToOne. You will be deployed onto a portfolio of high-impact projects each quarter — from new product launches, to commercial strategy, to operational turnarounds, to incubating new business lines and capabilities. Your portfolio of 1-2 projects will be revisited each quarter so you are always working on what matters most to the company.\n\nThe ideal candidate is a first-principles thinker, a builder, AI-native, and exceptionally sharp. You have founded a company, operated at the most senior level of a top scaleup, or built a track record of high-impact strategic work, and you are looking for your next high-leverage seat — one that gives you scale, mission, and direct CEO exposure without starting from scratch.\n\nThis role is a hybrid (onsite 3 days/week) position and reports directly to the VP of Business Operations and Chief of Staff, with active co-sponsorship from the CEO.\n\nResponsibilities:\n\nOwn CEO-Priority Projects:\n Lead one or more of BillionToOne's highest-priority strategic and operational initiatives each quarter, sourced directly from the CEO and Office of the CEO. Project types span new product launch support, commercial and go-to-market strategy, business development, operational excellence, competitive response, and the incubation of new business lines.\n\nFind Broken Things and Fix Them:\n Identify under-performing processes, workflows, or functions. Diagnose root cause, design the fix, and drive execution end-to-end with cross-functional teams.\n\nCross-Functional Leadership:\n Lead and influence cross-functional teams across Sales, Product, Lab Operations, Compliance, Reimbursement, Finance, BD, Legal, and HR. Build deep working knowledge of how each function operates through the projects you lead.\n\nOperate with AI:\n Drive results in ambiguous, fast-moving environments. Use first-principles thinking and AI-native fluency to move faster than the company would otherwise be able to.\n\nCEO and Executive Partnership:\n Participate in CEO meetings, present to the executive team on an ongoing basis, and serve as a trusted thought partner to the CEO and Chief of Staff on company-shaping decisions.\n\n \n\nQualifications:\n\n6-10+ years of building or operating experience, with a track record of exceptional impact in entrepreneurial or builder-oriented environments\n\nOne of the following backgrounds: founder of a company that has since been acquired, wound down, or moved on from; senior executive (COO, CPO, VP-level) who joined a top scaleup as one of its first 5 to 10 employees; or top-tier management consultant from MBB or a top boutique firm with healthcare or life sciences exposure, with some operational experience under your belt. \n\nFirst-principles thinker with exceptional analytical horsepower\n\nBuilder mentality — bias to action, comfort with ambiguity, ability to operate without a playbook\n\nAI-native fluency in using AI tools to move faster and amplify individual leverage\n\nStrong written and verbal communication, including with executives and the Board\n\nGenuine interest in molecular diagnostics and the BillionToOne mission\n\nOn-site position (relocation to SF Bay Area required)\n\nNice-To-Haves:\n\nPrior exposure to healthcare, life sciences, molecular diagnostics, or other regulated industries\n\nTrack record of building 0 to 1 — new products, new functions, new business lines, or new operating mechanisms\n\nExisting network in the founder community, YC ecosystem, or top scaleup operating community\n\nBenefits And Perks:\n\nWorking alongside brilliant, kind, passionate and dedicated colleagues, in an empowering environment, toward a global vision, striving for a future in which transformative molecular diagnostics can help millions of patients\n\nOpen, transparent culture that includes weekly Town Hall meetings\n\nThe ability to indirectly or directly change the lives of hundreds of thousands patients\n\nMultiple medical benefit options; employee premiums paid 100% of select plans, dependents covered up to 80%\n\nExtremely generous Family Bonding Leave for eligible employees (16 weeks, paid at 100%)\n\nSupplemental fertility benefits coverage\n\nRetirement savings program including a 4% Company match\n\nIncrease paid time off with increased tenure\n\nLatest and greatest hardware (laptop, lab equipment, facilities)\n\nFree daily on-site lunches provided from top eateries\n\nA variety of perks on campus (state of the art gym, restaurant)\n\nFree on-site EV charging (compatible with all EVs, including Tesla)\n\nAt BillionToOne, we are proud to offer a combination of (1) competitive base pay, (2) the opportunity for professional growth, and (3) industry leading company benefits (free healthcare options, 401k match, very generous fully paid \nparental\n leave etc.).\n\nFor this position, we offer a total compensation package of $460,105\n \nper year, including a base pay range of $203,651- $225,088\n \nper year.\n\nBillionToOne is an equal opportunity employer. We do not discriminate on the basis of race, religion, color, national origin, gender, sexual orientation, age, marital status, veteran status, or disability status.\nFor more information about how we protect your information, we encourage you to review our \nPrivacy Policy\n.\n\nBillionToOne is a next-generation molecular diagnostics company on a mission to make powerful, accurate diagnostic tests accessible to everyone. Our revolutionary QCT molecular counting technology enhances disease detection resolution by over a thousandfold using cell-free DNA,a breakthrough that has already transformed the lives of over half a million patients worldwide.\n\nOur Impact\n\nUnity Complete™\n is the only non-invasive prenatal screen capable of assessing fetal risk for both common recessive conditions and aneuploidies from a single maternal blood sample. \nUnity Confirm™\n \nenables non-invasive confirmation for high-risk screening results through the capture of intact circulating fetal cells using BillionToOne’s Fetal Cell Capture™ Technology. \nOur \nNorthstar®\n liquid biopsy test uniquely combines treatment selection with real-time monitoring, giving oncologists unprecedented precision in cancer care.\n\nOur Growth\n\nFrom $0 to $400M+ annualized revenue run-rate in just 6 years. In 2025, we completed one of the most successful IPOs for a medical diagnostics company, building on nearly $400M in private funding,including our $130M Series D in 2024 and backed by world-class investors including Hummingbird, Adams Street Partners, Neuberger Berman, Baillie Gifford, and Premji Invest.\n\nOur Recognition\n\nForbes named us one of \nAmerica's Best Startup Employers for 2025\n and we're \nGreat Place to Work certified\n, with 100% of our people willing to go the extra mile, even as we've scaled to over 700 employees.\n\nOur Future\n\nHeadquartered in Menlo Park with facilities in Union City, CA, and a new lab opening in Austin, TX in 2027, we're continuing to push the boundaries of what's possible in molecular diagnostics. We're just getting started.\n\nReady to help us change the world, one molecule at a time? Learn more at\n billiontoone.com", "has_role_fields": true, "auto": {"category": "job", "role_type": "Director of Office of the CEO", "seniority": "senior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "biotech", "remote_type": "bay_area", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.5}}, {"seq": 20, "dbid": 34567, "bucket": "Job", "title": "Lead Autonomy Behavior Engineer", "source": "greenhouse", "location": "Anywhere, USA", "url": "https://job-boards.greenhouse.io/maymobility/jobs/8551864002", "raw": "May Mobility is transforming cities through autonomous technology to create a safer, greener, more accessible world. Based in Ann Arbor, Michigan, May develops and deploys autonomous vehicles (AVs) powered by our innovative Multi-Policy Decision Making (MPDM) technology that literally reimagines the way AVs think.\nOur vehicles do more than just drive themselves - they provide value to communities, bridge public transit gaps and move people where they need to go safely, easily and with a lot more fun. We’re building the world’s best autonomy system to reimagine transit by minimizing congestion, expanding access and encouraging better land use in order to foster more green, vibrant and livable spaces. Since our founding in 2017, we’ve given more than 500,000 autonomous rides to real people around the globe. And we’re just getting started. We’re hiring people who share our passion for building the future, today, solving real-world problems and seeing the impact of their work. Join us.\nEssential Responsibilities\n\nDesign, implement, and test-state-of-the-art robotics software in C/C++ to enable comfortable and safe behavior and control for Autonomous Vehicles\n\nLead and participate in team code quality activities including design and code reviews \n\nProvide technical guidance to Technical Support Team on issue diagnosis and resolution\n\nCoordinate with cross functional teams to develop software and system requirements for Autonomous Vehicle behavior and controls subsystems\n\nCollaborate with data science team members to design and implement metrics capturing key performance indicators of Autonomous Vehicle  subsystems\n\nDevelop unit and simulation tests to validate vehicle performance across target operational domains\n\nCoordinate and execute on-vehicle tests to validate performance of Autonomous Vehicle software in real-world scenarios\n\nDiagnose and root-cause issues reported by commercial operations through the May Field Response process\n\nDevelop  tools and visualizations to enable support engineers to analyze performance of behavior and control subsystems from field data\n\nSkills and Abilities\n\nSuccess in this role typically requires the following competencies:\n\nExpert understanding of one or more of the following: behavior planning, decision making under uncertainty, path planning, probabilistic reasoning, prediction, machine learning, trajectory generation, controls or localization\n\nAwareness of the state of the art in the field, and be able to translate novel ideas into relevant solutions at May\n\nAbility to understand complex code bases and define architecture as a framework enabling others to solve problems. \n\nAbility to provide technical leadership for complex projects, including individual and team mentorship\n\nAbility to collaborate cross functionally with adjacent teams such as perception and controls as well as stakeholders outside of autonomy\n\nCommunicates technical direction effectively at all organizational and technical levels.\n\nDefines measurable success metrics for May's technical roadmap to ensure delivery and health of the system.\n\nQualifications and Experience\n\nCandidates most successful in this role typically hold the following qualifications or comparable knowledge or experience:\n\nRequired\n\nBachelor's degree in Robotics, Computer Science, Computer Engineering, or a field that requires a strong mathematical and/or engineering foundation (e.g. physics, aerospace engineering)\n\n7+ years of industry experience working on real-world robot systems including implementing at least two commercial projects working at a systems-level, delivering critical functions that make a robot work successfully in the field.\n\nExperience developing and deploying capabilities for robot behavior planning, decision making under uncertainty, path planning, probabilistic reasoning, prediction, machine learning, trajectory generation, controls and/or localization\n\nFamiliarity with multiple non-linear control methodologies appropriate to mobile robots or autonomous vehicles, such as MPC, LQR, PID, optimal control, stochastic control, adaptive control, and robust control\n\nStrong programming skills in C/C++\n\nExpertise with software development in a Linux environment\n\nFamiliarity with standard development tools such as git, valgrind, and gdb\n\nDesirable\n\nMasters or PhD in Robotics, Computer Science, or Electrical and Computer Engineering, Mechanical Engineering, or a field that requires a strong mathematical and/or engineering foundation (e.g. physics, aerospace engineering)\n\nStrong background in one of the robotics areas discussed above as demonstrated by developing and delivering to fielded robots multiple capabilities that solve critical problems in controls and motion planning\n\nFamiliarity with optimization techniques that are appropriate to mobile robots or autonomous vehicles, such as QP, control theoretic splines, and dynamics-aware approaches\n\nDemonstrated ability to mentor and support more junior engineers in learning and contributing to robotics development and testing\n\nStrong programming skills in C, software development in a Linux environment\n\nPhysical Requirements\n\nStandard office working conditions which includes but is not limited to:\n\nProlonged sitting\n\nProlonged standing\n\nProlonged computer use\n\nTravel required? -  Moderate: 11%-25%\n\nBenefits and Perks\n\nComprehensive healthcare suite including medical, dental, vision, life, and disability plans. Domestic partners who have been residing together at least one year are also eligible to participate. \n\nHealth Savings and Flexible Spending Healthcare and Dependent Care Accounts available.\n\nRich retirement benefits, including an immediately vested employer safe harbor match.\n\nGenerous paid parental leave as well as a phased return to work. \n\nFlexible vacation policy in addition to paid company holidays.\n\nTotal Wellness Program providing numerous resources for overall wellbeing   \n\nDon’t meet every single requirement? Studies have shown that women and/or people of color are less likely to apply to a job unless they meet every qualification. At May Mobility, we’re committed to building a diverse, inclusive, and authentic workforce, so if you’re excited about this role but your previous experience doesn’t align perfectly with every qualification, we encourage you to apply anyway! You may be the perfect candidate for this or another role at May.\n\nWant to learn more about our culture & benefits? Check out our \nwebsite\n!\n\nMay Mobility is an equal opportunity employer.  All applicants for employment will be considered without regard to race, color, religion, sex, national origin, age, disability, sexual orientation, gender identity or expression, veteran status, genetics or any other legally protected basis.   Below, you have the opportunity to share your preferred gender pronouns, gender, ethnicity, and veteran status with May Mobility to help us identify areas of improvement in our hiring and recruitment processes. Completion of these questions is entirely voluntary.  Any information you choose to provide will be kept confidential, and will not impact the hiring decision in any way. If you believe that you will need any type of accommodation, please let us know.\n\nNote to Recruitment Agencies:\n May Mobility does not accept unsolicited agency resumes. Furthermore, May Mobility does not pay placement fees for candidates submitted by any agency other than its approved partners.\nSalary Range\n$190,000\n—\n$230,000 USD", "has_role_fields": true, "auto": {"category": "job", "role_type": "autonomy behavior engineer", "seniority": "senior", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "robotics", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 21, "dbid": 504, "bucket": "Event", "title": "Body is the Interface workshop (Zach Lieberman <> tiat)", "source": "luma_events", "location": "tiat, 151 Powell St, San Francisco, CA 94102, USA", "url": "https://lu.ma/zachlieberman", "raw": "This hands-on workshop explores how the body can become an expressive tool for creative computation. Using p5.js and machine learning techniques like pose estimation, participants will learn how to connect movement and gesture to dynamic visual outputs. We’ll focus especially on the intersection of typography and the body, creating systems where physical motion shapes, distorts, or animates text. Participants will also explore interaction techniques like gesture recognition and body-based input to design playful, poetic, and embodied interfaces. No prior experience with machine learning is necessary, just curiosity and a willingness to move.\nZach Lieberman\n is an artist, researcher, and educator with a simple goal: he wants you surprised. In his work, he creates performances and installations that take human gesture as input and amplify them in different ways — making drawings come to life, imagining what the voice might look like, and transforming people’s silhouettes into music. He’s been listed as one of Fast Company’s Most Creative People, he’s won the Golden Nica from Ars Electronica, Interactive Design of the Year from Design Museum London as well as listed in Time Magazine’s Inventions of the Year. He creates artwork through writing software and is a co-creator of \nopenFrameworks\n, an open source C++ toolkit for creative coding and helped co-found the \nSchool for Poetic Computation\n, a school examining the lyrical possibilities of code. He is a professor at MIT Media Lab, where he leads the Future Sketches group, and is a member of AGI (Alliance Graphique International).\nThis workshop will be hosted at tiat! tiat ​is \nthe intersection of art and technology\n! we are a 501c3 nonprofit for creative technologists to experiment, exhibit, and expand their practice. ⋆౨ৎ˚⟡˖ more on tiat instagram: \nhttps://www.instagram.com/tiat.place", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": null, "deadline": null, "tag_confidence": 0.85, "content_quality": 6.5}}, {"seq": 22, "dbid": 520, "bucket": "Event", "title": "World's largest design picnic | Config 2026 Wind-down Picnic with Design Buddies & friends! 🐰", "source": "luma_events", "location": "Alamo Square Park, Hayes St, San Francisco, CA 94117, USA", "url": "https://lu.ma/azhjlwuv", "raw": "World's largest design picnic | Config 2026 Wind-down Picnic with Design Buddies & friends! 🐰", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": null, "deadline": null, "tag_confidence": 0.85, "content_quality": 1.0}}, {"seq": 23, "dbid": 535, "bucket": "Event", "title": "THE AI Engineer Afterparty", "source": "luma_events", "location": "San Francisco, CA", "url": "https://lu.ma/composio-lh5g", "raw": "THE AI Engineer Afterparty", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": null, "deadline": null, "tag_confidence": 0.5, "content_quality": 5.5}}, {"seq": 24, "dbid": 7351, "bucket": "Event", "title": "AWS Agentic AI Summit with MongoDB Mastra", "source": "meetup", "location": "San Francisco, CA", "url": "https://www.meetup.com/sfbay-ai/events/315494713/", "raw": "Important note: Register on the [AICamp Event Website](https://www.aicamp.ai/event/eventdetails/W2026071517)[ ](https://www.aicamp.ai/event/eventdetails/W2026062417)is REQUIRED for admission.\n\n**From Code to Production - Building Production-Ready AI Agents on AWS**\n\nThe AWS Agentic AI Partner Showcase Extended features experts from **AWS, MongoDB and Mastra**, who will demonstrate how to build production-ready agentic AI systems from code to deployment. This focused session presents a complete development stack through live demonstrations, technical deep dives, and interactive discussions.\n\nIn addition to main stage tech talks and demos, partner booths will be available onsite throughout the event for attendees to visit, engage in Q&A, and deep dive into each partner's solution. The speakers will share practical insights into building, monitoring, and validating agentic AI applications that enhance your business processes and drive innovation.\n\n**What You Will Learn:**\n✔ Production-Ready Agentic AI – See live demonstrations of the complete development stack for building agentic AI systems, from coding environments through deployment and monitoring.\n✔ Technical Implementation Strategies – Gain insights from AWS and partner experts on deploying agentic AI solutions with real-world use cases and AWS integration patterns.\n✔ Expert Q&A & Networking – Engage directly with technical leaders from AWS and partner companies at dedicated booth stations, plus connect with fellow developers and practitioners building agentic AI applications.\n\n**Agenda**\n\n* 4:30PM - 5:30PM Check-In, Food and Booth Visiting\n* 5:30PM - 7:45PM Kick-off, Tech talks, Live Demo\n* 7:45PM - 8:30PM Networking, Q&A over Booths\n\n**Featured Speakers:**\n\n##### Abhijit Chakraborty\n\nSenior Partner Solutions Architect, MongoDB\n\n##### Sam Bhagwat\n\nFounder/CEO, Mastra\n\n##### Sathisan Vannadil\n\nSr. Partner Solution Architect, AWS\n\n#####", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.0}}, {"seq": 25, "dbid": 7364, "bucket": "Event", "title": "Ingesting Agent Traces with dlthub", "source": "meetup", "location": "(none)", "url": "https://www.meetup.com/datatalks-meetups-global/events/314993420/", "raw": "​In this hands-on workshop, we'll show you how to stop flying blind on your AI agents. Using dltHub Pro we'll build a pipeline that ingests agent traces (e.g. tool calls, intermediate steps, token usage, and outcomes) and transforms them into structured, queryable data.\n\n​From there, we'll turn that data into reports that actually tell you what your agents are doing, where they're failing, and how to make them better.\n\n​**You'll learn how to:**\n\n* ​Capture and normalize agent traces into a consistent schema\n* ​Transform and model nested, variable-length trace data with dltHub Pro\n* ​Deploy your pipeline and build reports that surface real insights about agent performance\n\n​\nBy the end, you'll have a working reporting layer for your AI agents, so you can debug faster, optimize smarter, and ship with confidence.\n\n​**About the speaker:**\nAlena is a DevRel at dltHub. She builds and optimizes data pipelines, engages with dltHub community, and creates educational content to make data processing more accessible.\n\nThis event is sponsored by [dltHub](https://dlthub.com/?utm_source=luma)\n\n\\*\\*Join our Slack: [https://datatalks.club/slack.html**](https://datatalks.club/slack.html**)", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.9, "content_quality": 7.5}}, {"seq": 26, "dbid": 7376, "bucket": "Event", "title": "CyberConnect: Virtual Career & Networking Hub for Cybersecurity Pros", "source": "meetup", "location": "Virtual", "url": "https://www.meetup.com/ac-sfo/events/315236665/", "raw": "Whether you're a SOC analyst, red teamer, threat intelligence expert, or just breaking into the field — **CyberConnect** is your global destination for building meaningful connections and exploring opportunities in the cybersecurity domain.\n\nThis powerful, **cybersecurity networking event online** brings together cybersecurity specialists, hiring companies, and solution providers in an unmoderated, self-managed, community-led virtual environment. Perfect for job seekers, employers, freelancers, and infosec enthusiasts alike — this event enables career growth, peer learning, and real-time knowledge sharing.\n\n🎥 **Watch how the event works with our explainer video:**\n👉 [https://www.youtube.com/watch?v=VToIVvIjIPY](https://www.youtube.com/watch?v=VToIVvIjIPY)\n**💬 What to Expect at CyberConnect:**\nJoin a rich virtual environment where you can **chat in real time**, join discussions in group channels, or conduct **1-on-1 video conversations** to dive deeper into opportunities and collaborations.\nThis **online community for cybersecurity specialists** features curated channels for open conversation and focused professional engagement:\n\n* **General** – Your orientation hub for intros, announcements, and casual conversation.\n* **Intros** – Introduce yourself, your role in cybersecurity, or just share a fun fact and meet peers.\n* **Networking** – Showcase your current projects, open-source contributions, or job aspirations.\n* **Help Wanted** – Post or respond to open calls for SOC support, pen testers, or digital forensics pros.\n* **Industry Room Tech** – Stay sharp on industry trends, tools, frameworks, and methodologies.\n* **CTFs & Collaboration** – A dedicated zone for **ethical hacking collaboration groups** and red/blue team brainstorming.\n* **Tools & Techniques** – Discuss and demo the latest utilities, workflows, and cyber strategies in this **cybersecurity skill sharing platform**.\n\nThis is not just a **virtual cyber career fair** — it's a living, breathing ecosystem for cybersecurity innovation, learning, and hiring.\n**📍 Where:**\nJoin virtually at:\n👉 [https://events.tao.ai/pod/analytics.club/pu2wlhti0luw](https://events.tao.ai/pod/analytics.club/pu2wlhti0luw)\n**🕓 When:**\nSessions run from **4:00 PM – 6:00 PM local time**. Drop in to connect and contribute.\n**👤 Who Should Attend:**\n\n* Cybersecurity professionals across SOC, GRC, DevSecOps, and penetration testing\n* Recruiters and employers hiring cybersecurity talent\n* Students and graduates exploring careers in ethical hacking or cyber defense\n* Researchers, consultants, and cyber product developers\n* Anyone passionate about infosec, privacy, and threat detection\n\n**🧠 Why Attend:**\n\n* Connect with like-minded professionals across the globe\n* Explore real-time hiring opportunities or freelance gigs\n* Discover new tools and red/blue teaming techniques\n* Join hands-on channels for community-driven knowledge exchange\n* Demo your work or learn from the best in **AI-driven security**, cloud security, and more\n* Build strong relationships in the cyber domain through **1-1 video/text chats**\n\n**❓ Have Questions or Suggestions?**\nReach out to us at:\n👉 [https://noworkerleftbehind.org/event_support](https://noworkerleftbehind.org/event_support)\n**🔖 Hashtags:**\n#CyberConnect #CybersecurityNetworkingEventOnline #VirtualCyberCareerFair #OnlineCommunityForCybersecuritySpecialists #EthicalHackingCollaborationGroup #CybersecuritySkillSharingPlatform #InfosecNetworking #CyberJobs #RedTeamBlueTeam #SOCNetworking #GlobalCyberNetworking", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 7.5}}, {"seq": 27, "dbid": 7391, "bucket": "Event", "title": "July 10 - Best of CVPR (Day 3)", "source": "meetup", "location": "Online", "url": "https://www.meetup.com/san-francisco-the-machine-learning-conference/events/314912163/", "raw": "Welcome to the Best of CVPR series — your virtual front row to groundbreaking research, insights, and innovations from one of computer vision's premier conferences. Live from the authors to you.\n\n**Date, Time and Location**\n\nJul 10, 2026\n9 AM - 11 AM PT\nOnline. **[Register for Zoom!](https://voxel51.com/events/best-of-cvpr-july-10-2026)**\n\n**Advancing Generative Quality and Reasoning in Multimodal AI**\n\nThis talk exposes hidden limitations of frontier multimodal models across reasoning and visual generation, demonstrates the inherent brittleness of VLMs and audio-visual MLLMs, and introduces simple yet effective techniques to build robustness. It also covers human-centric metrics for perceptually accurate evaluation of generative media.\n\n*About the Speaker*\n\n[Deepti Ghadiyaram](https://www.linkedin.com/in/deeptigp/) is an Assistant Professor of Computer Science at Boston University. Her research focuses on building safe, interpretable, and robust computer vision systems with advanced reasoning capabilities. Before joining BU she was at Runway and Meta AI, and earned her PhD from UT Austin in 2017.\n\n**HyperRealm: Hyperbolic Vision Language Models for Real-World Hierarchical Multimodal Understanding**\n\nReal-world multimodal data naturally exhibits hierarchical structure, yet standard VLMs like CLIP align images and text in Euclidean space, which cannot preserve tree-like hierarchies. HyperRealm embeds images and text in a Poincaré ball to encode hierarchical relationships, introducing an adaptive entropy-driven entailment loss. Evaluated on 18 zero-shot classification benchmarks, it shows consistent improvements over Euclidean CLIP baselines.\n\n*About the Speaker*\n\n[Kathy Wu](https://www.linkedin.com/in/kathy-wu-ph-d-a8155563/) holds a Ph.D. in Applied Mathematics from USC. She is currently an Applied Scientist at Amazon within the Global Store organization, leading projects in e-commerce recommendation, multimodal VLMs, and LLM/GenAI applications. Her research has been published at ICCV, CVPR, ICLR, SIGIR, and WACV.\n\n**Cross-Modal Domain Adaptation using Semantic Parametric Mapping**\n\nXD-MAP is a framework that transfers semantic knowledge from image datasets to LiDAR by constructing semantic parametric maps from monocular detections and geometric priors. Unlike previous approaches, XD-MAP does not require overlapping sensor views and enables scalable 360° supervision for LiDAR perception without manual annotation.\n\n*About the Speaker*\n\n[Frank Bieder](https://www.linkedin.com/in/franklynjey/) is a researcher in computer vision and autonomous systems, leading the Visual and Spatial Learning group at FZI Research Center for Information Technology. His research covers multimodal perception, map-based learning, and cross-sensor domain adaptation for autonomous driving. He received his Ph.D. from KIT in 2026.\n\n**WalkGPT: Pixel-Grounded Navigation Guidance for Pedestrians**\n\nPedestrian navigation requires more than generic scene description; users need to understand walkable areas, obstacles, and the distance of surrounding objects. In this talk, I will present WalkGPT, a grounded vision-language model for accessibility-aware pedestrian navigation. WalkGPT connects language reasoning with segmentation masks and object-level distance estimates to generate grounded navigation guidance from pedestrian-view images. I will also introduce PAVE, a 41k-sample benchmark for depth-aware accessibility reasoning in real pedestrian environments. The talk will highlight how grounded multimodal AI can support safer and more interpretable pedestrian assistance.\n\n*About the Speaker*\n\n[Rafi Ibn Sultan](https://www.linkedin.com/in/rafi-ibn-sultan/) is a Ph.D. researcher in Computer Science at Wayne State University, working on computer vision, multimodal AI, and vision-language models. His research focuses on grounded and interpretable AI systems for real-world visual reasoning, including pedestrian navigation and medical image segmentation. His recent work includes WalkGPT, accepted at CVPR 2026, and GeoSAM, accepted at ECAI 2025.", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": "2026-07-10", "tag_confidence": 0.95, "content_quality": 8.5}}, {"seq": 28, "dbid": 7397, "bucket": "Event", "title": "July 8 - Best of CVPR (Day 1)", "source": "meetup", "location": "Online", "url": "https://www.meetup.com/san-francisco-the-machine-learning-conference/events/314911623/", "raw": "Welcome to the Best of CVPR series — your virtual front row to groundbreaking research, insights, and innovations from one of computer vision's premier conferences. Live from the authors to you.\n\n**Date, Time and Location**\n\nJul 08, 2026\n9 AM - 11 AM PT\nOnline. **[Register for Zoom!](https://voxel51.com/events/best-of-cvpr-july-8-2026)**\n\n**Some Modalities Are More Equal Than Others: Understanding and Improving Multimodal Integration in MLLMs**\n\nMultimodal large language models can process vision, audio, and text, but it remains unclear whether they truly integrate these modalities or rely on shortcut cues. In this talk, I will present our recent work, [“Some Modalities Are More Equal Than Others,](https://arxiv.org/abs/2511.22826)” where we introduce MMA-Bench, a benchmark designed to probe MLLMs under controlled audio–visual conflict, misleading text, and modality-specific queries. Through black-box evaluation and white-box attention analysis, we show that current MLLMs often struggle when modalities disagree, exhibit model-specific modality biases, and can be distracted by irrelevant textual context. We further propose an alignment-aware tuning strategy that trains models to answer based on the queried modality, improving robustness and multimodal grounding. This talk will highlight both the failure modes of current MLLMs and practical directions toward more reliable cross-modal reasoning.\n\n*About the Speaker*\n\n[Tianle Chen](https://www.linkedin.com/in/tianle-chen-1811341b7/) is a Ph.D. student in Computer Science at Boston University, advised by Prof. Deepti Ghadiyaram. His research focuses on multimodal large language models, audio–visual reasoning, robustness, and trustworthy multimodal AI. He is interested in understanding how models allocate evidence across modalities and designing methods that improve reliable multimodal reasoning.\n\n**LinkedOut: Linking World Knowledge Out of Video LLMs for Next-Generation Video Recommendation**\n\n[This CVPR 2026 wor](https://arxiv.org/abs/2512.16891)k links structured world knowledge representations out of Video LLMs for next-generation video recommendation, covering how large vision-language models can provide rich semantic priors for video understanding while addressing efficiency and deployment challenges in real recommendation systems.\n\n*About the Speaker*\n\n[Haichao Zhang](https://www.linkedin.com/in/haichao-zhang/) is a Ph.D. candidate in Computer Engineering at Northeastern University. His research focuses on computer vision, vision-language models, video understanding and generation, and efficient multimodal foundation models. He has research experience at Google CoreML, Meta Reality Labs, LinkedIn Video AI, Amazon AWS AI Labs, and Tencent.\n\n**CylinderDepth: Cylindrical Spatial Attention for Multi-View Consistent Self-Supervised Surround Depth Estimation**\n\nThis paper presents [CylinderDepth](https://arxiv.org/abs/2511.16428), a self-supervised surround depth estimation method leveraging cylindrical spatial attention for multi-view consistency across camera rigs.\n\n*About the Speaker*\n\nSamer Abualhanud is a PhD student and research staff member at Leibniz University Hannover, Germany, supervised by Dr.-Ing. Max Mehltretter and Prof. Christian Heipke. Research focuses on multi-view consistency in 3D reconstruction.\n\n**Your ViT is Secretly Also a Video Segmentation Model**\n\nExisting online video segmentation models typically combine a per-frame segmentation module with complex, specialized tracking modules. This work shows that a plain Vision Transformer encoder with a lightweight temporal module can match that performance, resulting in VidEoMT — up to 5–10x faster, running at up to 160 FPS with a ViT-L encoder.\n\n*About the Speaker*\n\n[Daan de Geus](https://www.linkedin.com/in/ddegeus/) is an Assistant Professor in the Mobile Perception Systems Lab at TU/e. He received his PhD (cum laude) from TU/e in 2024, and his research focuses on machine learning for visual and multimodal scene understanding.", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": "2026-07-08", "tag_confidence": 0.95, "content_quality": 8.5}}, {"seq": 29, "dbid": 7398, "bucket": "Event", "title": "Building with AI: Show, Share, and Collaborate", "source": "meetup", "location": "(none)", "url": "https://www.meetup.com/projects/events/315449925/", "raw": "Come share your explorations in artificial intelligence.\n\nLet's demonstrate the things we've actually built and trade hard-won tricks. Whether you're an AI engineer, a programmer, or someone who found their way in through vibe coding, there's a seat for you.\n\nCome hear what others are working on, and show us:\n\n* The new products and tools you've discovered.\n* How you've figured out to get the most out of your coding bot.\n* Your newest agentic AI workflow or automation.\n* Your latest dive into machine learning — neural nets and otherwise.\n\nAnd if you're looking for people to build with, you're in the right room. A few of us are hoping to find collaborators for projects.\n\n**Please register through Zoom (one-time registration):**\n[https://us02web.zoom.us/meeting/register/cU4kUPfiR0uvdlsc6Q_zrg](https://us02web.zoom.us/meeting/register/cU4kUPfiR0uvdlsc6Q_zrg)\n\nAfter registering, save the Zoom link and use it to join future sessions by signing into your Zoom account.", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.9, "content_quality": 7.0}}, {"seq": 30, "dbid": 7400, "bucket": "Event", "title": "The Future of Agentic Engineering and AI Workforces with Qoder", "source": "meetup", "location": "San Francisco, CA", "url": "https://www.meetup.com/aibuilders-sv/events/315367942/", "raw": "**Overview**\nFor engineering and business leaders at high-growth companies, this invite-only gathering goes beyond “which AI tool should we use?” to examine how autonomous AI workforces are moving from model to production.\n\nQoder, QoderWork, AI Builders, and Z.AI will bring together CTOs, VPs of Engineering, founders, and technical executives to explore how specialized AI agents can scale coding and everyday work while preserving architecture judgment, code ownership, review discipline, and security.\n\nThe session will go under the hood of Qoder Expert Mode and QoderWork’s multi-agent workflows, alongside Z AI’s GLM-5.2, a flagship model for long-horizon tasks, project-scale engineering context, and agentic coding with a 1M-token context window.\n\n**Agenda**\n\n* **2:00 PM** — Check-in & Pre-Networking\n* **2:30 PM** — Opening Remarks\n* **2:40 PM** — Qoder/QoderWork Intro and Demo — Joey Huang (Solution Architect, Qoder)\n* **3:10 PM** — The Production & Ecosystem Layer — Chenyi Zhang (Member of Technical Staff, Character AI)\n* **3:40 PM** — The Model Layer Perspective — Cara Li (Head of Global Ecosystem Partnerships, Z AI)\n* **4:10 PM** — Open Networking\n* **5:00 PM** — Event Closes\n\n**Who Should Join**\n\n* CEO/CTOs and Heads of Engineering deciding how AI coding should securely enter their engineering orgs.\n* Senior AI Engineers and Platform Leads building next-gen AI agents looking to harness the full potential of the model layer.\n* Business Leaders and Founders looking to optimize resource allocation and accelerate top-line growth via autonomous workforce agents.\n\n**Perks**\n\n* Every attendee will receive 2,000 Qoder credits upon creating/registering their active Qoder account.\n* Food and drinks included throughout the open networking session.\n\n**Co-hosts**\n\n* **Qoder** — an agentic coding platform that helps developers automate complex software tasks. QoderWork operates as a macro-level, autonomous agentic teammate for everyday work.\n* **AI Builders** — a premier community of builders, developers, and innovators in the San Francisco Bay Area, Singapore, and Tokyo.\n* **Corgi** — a full-stack insurance platform for technology companies, home to Corgi Cafe: a 24/7 space for builders, founders, and investors.\n\n*This is an invite-only event and approval is required to attend.*", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 31, "dbid": 7410, "bucket": "Event", "title": "Get Google AI Certified - AI Professionals' July 2026 Cohort", "source": "meetup", "location": "(none)", "url": "https://www.meetup.com/ai-professionals-san-francisco/events/315403648/", "raw": "**Free AI Professional Certification from Google: Use It, or Build a Business On It.**\n\nJoin us as we work through Google's AI Professional Certificate on Google Skills — completely free. We're working together, live, one course a week, for 7 weeks.\nAt the end of the 7 weeks, you'll walk away with an AI Fluent certificate from AI Professionals.\n\nWant the actual Google AI Professional Certificate as well? Sign up for the 7-day free trial at Google Skills after we complete our 7 weeks of training.\n\n*Note: Coursera offers the same certificate for $49 USD for the one month you need it.*\n\nEither way, it's optional, and by week 7, you'll already know the material cold, so it's a fast finish if you choose to add it.\"\n\nWhether you want to p
