<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs Pipeline Eval</title>
<style>
:root {
  --bg: #1e1f22;
  --panel: #26272b;
  --border: #3a3b40;
  --text: #e6e6e6;
  --text-dim: #9a9ba0;
  --accent: #6ea8fe;
  --accent-bg: #1c2a3d;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --mk-seniority: #f5a623;
  --mk-engagement: #7ee787;
  --mk-remote: #ff9ac1;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}
header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--text-dim); }
.progress { font-size: 13px; color: var(--text-dim); }
.nav-btns { margin-left: auto; display: flex; gap: 6px; }
button {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
select#jumpTo {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 13px; max-width: 220px;
}
main { flex: 1; display: flex; overflow: hidden; }
.pane { overflow-y: auto; padding: 20px 24px; }
.pane.left { flex: 1.3; border-right: 1px solid var(--border); }
.pane.right { flex: 1; background: var(--panel); }
.bucket-tag {
  display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--accent); background: var(--accent-bg); padding: 2px 8px; border-radius: 4px; margin-bottom: 10px;
}
h2 { font-size: 19px; margin: 6px 0 4px; }
.meta { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.6; }
.meta a { color: var(--accent); }
.legend { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.rawtext {
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  background: #1a1b1e;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  max-height: 65vh;
  overflow-y: auto;
}
.rawtext mark { border-radius: 3px; padding: 0 2px; color: #111; }
.rawtext mark.mk-seniority { background: var(--mk-seniority); }
.rawtext mark.mk-engagement { background: var(--mk-engagement); }
.rawtext mark.mk-remote { background: var(--mk-remote); }
.field { margin-bottom: 16px; }
.field > label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.field input[type=text], .field textarea {
  width: 100%;
  background: #1a1b1e;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
}
.field textarea { resize: vertical; min-height: 50px; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-group button.opt {
  background: #1a1b1e;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
}
.btn-group button.opt:hover { border-color: var(--accent); color: var(--text); }
.btn-group button.opt.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.autotag {
  margin-top: 20px;
  font-size: 12px;
  color: var(--text-dim);
  border-top: 1px dashed var(--border);
  padding-top: 12px;
}
.autotag summary { cursor: pointer; color: var(--accent); }
.autotag code { color: #d0d0d0; }
footer {
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}
footer .hint { font-size: 12px; color: var(--text-dim); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>Jobs Pipeline &mdash; Eval</h1>
  <span class="progress" id="progress"></span>
  <select id="jumpTo"></select>
  <div class="nav-btns">
    <button id="exportBtn">Export answers (JSON)</button>
    <button id="exportCsvBtn">Export answers (CSV)</button>
  </div>
</header>
<main>
  <div class="pane left">
    <div class="bucket-tag" id="bucketTag"></div>
    <h2 id="itemTitle"></h2>
    <div class="meta" id="itemMeta"></div>
    <div class="legend" id="legend"></div>
    <div class="rawtext" id="itemRaw"></div>
  </div>
  <div class="pane right">
    <div class="field">
      <label>Category</label>
      <div class="btn-group" id="categoryButtons"></div>
    </div>
    <div id="jobFields"></div>
    <div class="field">
      <label>Remote type</label>
      <div class="btn-group" id="remoteTypeButtons"></div>
    </div>
    <div class="field">
      <label>Is the pipeline's classification correct?</label>
      <div class="btn-group" id="correctButtons"></div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="notes"></textarea>
    </div>
    <details class="autotag">
      <summary>Show auto-tagged (system output)</summary>
      <div id="autoTagBody" style="margin-top:8px;"></div>
    </details>
  </div>
</main>
<footer>
  <button id="prevBtn">&larr; Prev</button>
  <button id="nextBtn" class="primary">Next &rarr;</button>
  <span class="hint">Answers autosave to this browser (localStorage). Export when done.</span>
</footer>

ads.\n\nContribute directly to key components across the serving infrastructure — from model container builds and deployment workflows to runtime systems like routing, caching, observability, and intelligent autoscaling — ensuring smooth and efficient operations at scale.\n\nCollaborate cross-functionally with product, platform, and research teams to translate customer needs into reliable and performant systems.\n\nLead technical initiatives that improve latency, availability, and cost-effectiveness across both customer-facing and foundational serving layers.\n\nEstablish best practices for code quality, testing, and operational readiness, and mentor other engineers through design reviews and technical guidance.\n\nRepresent the team in cross-organizational technical discussions and influence Databricks’ broader AI platform strategy.\n\nWhat we look for:\n\n10+ years of experience building and operating large-scale distributed systems.\n\nDeep expertise in model serving, inference systems, and related infrastructure (e.g., routing, scheduling, autoscaling, and observability).\n\nStrong foundation in algorithms, data structures, and system design as applied to large-scale, low-latency serving systems.\n\nProven ability to deliver technically complex, high-impact initiatives that create measurable customer or business value.\n\nExperience leading architecture for large-scale, performance-sensitive CPU/GPU inference systems.\n\nStrong communication skills and ability to collaborate across teams in fast-moving environments.\n\nStrategic and product-oriented mindset with the ability to align technical execution with long-term vision.\n\nPassion for mentoring, growing engineers, and fostering technical excellence.\n\n \n\nPay Range Transparency\n\nDatabricks is committed to fair and equitable compensation practices. The pay range(s) for this role is listed below and represents the expected salary range for non-commissionable roles or on-target earnings for commissionable uity Grade - 4\n\nEmployees new to Affirm typically come in at the start of the pay range. Affirm focuses on providing a simple and transparent pay structure which is based on a variety of factors, including location, experience and job-related skills.\n\nBase pay is part of a total compensation package that may include monthly stipends for health, and wellness and tech spending. In addition, the employees may be eligible for equity rewards offered by Affirm Holdings, Inc. (parent company).\n\nESP base pay range per year: €71,000 - €101,000\n\nAdditional benefits include:\n• Flexible Spending Wallets for tech, food and lifestyle\n• Away Days - wellness days to take off work and recharge\n• Learning & Development programs\n• Parental benefits\n• Employee Resource & Community Groups\n\nPlease note that visa sponsorship is not available for this position.\n\n#LI-Remote\n\nAffirm is proud to be a remote-first company! The majority of our roles are remote and you can work almost anywhere within the country of employment. Affirmers in proximal roles have the flexibility to work remotely, but will occasionally be required to work out of their assigned Affirm office. A limited number of roles remain office-based due to the nature of their job responsibilities.\n\nWe’re extremely proud to offer competitive benefits that are anchored to our core value of people come first. Some key highlights of our benefits package include: \n\nHealth care coverage - Affirm covers all premiums for all levels of coverage for you and your dependents \n\nFlexible Spending Wallets - generous stipends for spending on Technology, Food, various Lifestyle needs, and family forming expenses\n\nTime off - competitive vacation and holiday schedules allowing you to take time off to rest and recharge\n\nESPP - An employee stock purchase plan enabling you to buy shares of Affirm at a discount\n\nWe believe It’s On Us to provide an inclusive interview experience for all, including people with disabilities. ublic", "spam_risk": "suspicious", "deadline": null, "tag_confidence": 0.75, "content_quality": 6.5}}, {"seq": 4, "dbid": 9333, "bucket": "Job", "title": " Senior Revenue Accountant", "source": "ashby", "location": "Toronto", "url": "https://jobs.ashbyhq.com/cohere/1e2d0f32-774f-4061-954d-0e28bfe054ca", "raw": "Business Operations, FullTime\nWho are we?\nCohere is the leading security-first enterprise AI company. We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.\nWe’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.\nWe obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.\nWe are a global technology company co-headquartered in Toronto and San Francisco, with key offices in London, New York City, Montreal, Seoul, Germany and Paris. Join us!\nAs a Senior Revenue Accountant at Cohere, you will: \nPerform detailed contract review and analysis for non-standard arrangements to determine appropriate revenue recognition treatment in accordance with ASC 606 \nLead and execute all revenue- and commission-related month-end, quarter-end, and year-end close activities \nPrepare and review monthly balance sheet reconciliations for all revenue, commission, and related accounts, including deferred revenue, accounts receivable, and contract assets \nServe as a primary point of contact for external auditors on all revenue-related matters, providing comprehensive documentation, schedules, and explanations \nParticipate in cross-functional initiatives to streamline and automate revenue accounting processes within the ERP system (e.g., NetSuite, Salesforce) \nCollaborate with Finance, Order Operations, and Product teams to set up end-to-end order-to-cash testing for new products, features, and pricing and packaging \nLead ad hoc reporting and project engagements \nThis career opportunity may be a good match for you if you have: \n5+ years of progressive accounting experience, with at least 2 years focused on revenue accounting \nDeep working knowledge of US GAAP and ASC 606 \nProficiency with a major ERP system (e.g., NetSuite) and advanced Microsoft Excel skills \nStrong analytical, problem-solving, and organizational skills with exceptional attention to details \nExperience with NetSuite ARM is a plus \nExcellent written and verbal communication skills combined with experience communicating/collaborating with non-finance teams \nExperience supporting audit processes and working with external auditors \nBachelor’s degree in Accounting, Finance, or a related field; CPA preferred\nCohere is committed to fair and transparent pay practices. The salary range listed for this role reflects the expected base compensation. Actual compensation offered will be determined by factors such as location, level, job-related knowledge, skills, education, and experience.\nFor candidates in the United States, the Compensation Range is : $185,000 – $230,000 USD\nFor candidates in Canada, the Compensation Range is : $210,000 – $260,000 CAD\nFull-Time Employees at Cohere enjoy these Perks:\nA weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.\nFull health and dental benefits, including a separate budget for mental health.\nRRSP matching, 401K, Pension Scheme.\n100% Parental Leave top-up for up to 6 months, for either parent.\nAnnual enrichment benefits:\nArts & culture, fitness/wellness, quality time, and a workspace improvement credit.\nEducation & learning stipend for conferences, courses, and coaching.\n6 weeks of paid vacation (30 working days!)\nBudget for traveling to other offices if you are remote, plus an annual company offsite.\nHow and Where We Work:\nCohere is remote-friendly. We have offices in Toronto, San Francisco, New York City, London, Paris, Montreal, and more coming soon.\nFor those in the office: a daily lunch program, plenty of snacks, and regular community and social events.\nFor those not near an office: a co-working benefit so you can work alongside others in your city.\nEveryone receives a $500 home office stipend to set up your workspace properly.\nIf any of the above doesn’t line up exactly with your experience, we still encourage you to apply. \nWe strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an\n Accommodations Request Form\n, and we will work together to meet your needs.\nWe may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn't limit the applications our recruiters may review or consider.", "has_role_fields": true, "auto": {"category": "job", "role_type": "Senior Revenue Accountant", "seniority": "senior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "ai_ml", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 5, "dbid": 14649, "bucket": "Job", "title": "Principal Data Scientist - Cloud Gaming and AI", "source": "linkedin_apify", "location": "Santa Clara, CA", "url": "https://www.linkedin.com/jobs/view/principal-data-scientist-cloud-gaming-and-ai-at-nvidia-ai-4429461154?position=2&pageNum=10&refId=JyS2jb053Akr2LI4DHV9oQ%3D%3D&trackingId=F0nwmBbHVMTAVyPLa%2BDOGw%3D%3D", "raw": "Not Applicable, Full-time\nJob Requisition ID\n\nJR2019886\n\nJob Category\n\nIT - Information Technology\n\nTime Type\n\nFull time\n\nJoin the NVIDIA GeForce NOW cloud team that allows users to play high-quality PC games on various devices, without the need for a dedicated gaming PC or console. NVIDIA's GeForce NOW service is built on top of our GPU technology, including our proprietary GPU architectures and software optimizations allowing efficient and high-quality experience even at high resolutions and fps and at industry leading low latencies.\n\nOur team is building the Diagnostic, Prescriptive and AI-augmented Analytics solutions that encompass processing, visualization, anomaly detection, root cause and predictive modeling for the benefit of millions of our end users. Our active projects include real-time forecasting of demand, constraint-optimized capacity allocation, dynamic prescriptions per session, Customer Onboarding and Voice of Customer Analytics, targeted Customer Outreach campaigns based on Customer Retention modeling, effective personalized diagnostic recommendations, LLM Chatbot. You will wield the power of Data and AI to help globally deliver a best-in-class cloud computing/streaming performance and experience. Our technology stack relies on industry standard components and tools (Python, R, Pandas, JupyterLab, Spark, SQL, Databricks, MLFlow, Delta Lake, Grafana, Kibana, Kubeflow, Elyra, Kubernetes, Gitlab, CI/CD, MLOps, Kafka, SQS, Kubernetes)\n\nWhat You'll Be Doing\n\n- Provide Technical Leadership to the team of Data Scientists and Engineers working on global deployment at scale of GPU Compute services.\n- Work with Leadership and Stakeholders to understand top level requirements, build a tech roadmap, design solutions and guide the team to deliver results.\n- Acquire and apply domain knowledge of the product and platform to lead the design, implementation, and deployment of AI/ML based solutions for generating actionable insights and real-time prescriptive analytic pipelines to drive optimal outcomes for production services.\n- Build and Deploy real time and scalable solutions for real time User Diagnostics, LLM Chatbot, dynamic Suspicious Activity Detection, User feedback based clustering and alerting and LLM based Actionable Insight Generation solutions for Engineering And Management.\n- Improve productivity of the org by wrangling petabytes of data using statistical/AI/ML/LLM models to provide actionable and real time insights.\n- Leverage pioneering Forecasting models and Constraint Optimization solvers to improve capacity management and deliver server efficiency and end-user latency.\n- Leverage innovative ML/AI predictive models with explainability for User Retention/Churn and designing outreach campaigns.\n- Build innovative multi-agent self-learning Harnesses for improving engineering productivity for analytics and deployments.\n\nWhat We Need To See\n\n- Master’s/PhD or equivalent experience in Data Science, Statistics, Mathematics, Physics, Operations Research or related quantitative field\n- 15+ years of software experience for large-scale and reliable production deployments and 8+ years of proven experience in Statistics/AI/ML \n- Hands-on expertise in programming languages like Python, SQL, Java and modeling frameworks like Scikit-learn, Pytorch, TensorFlow for large projects.\n- Experience with common tools for data storage and processing (e.g. Spark, Pandas, Delta Lake) including drilling into problems of running large scale software in a big network.\n- Excellent verbal and written communication skills to convey rich data insights to non-Technical and Technical Stakeholders.\n- An outstanding track record of successful past projects, as a lead, related to the research and application of data science at scale.\n- Experience of User Retention Modeling, LLMs, Time Series Forecasting or Operations Research is a plus.\n\nWith competitive salaries and a generous benefits package, NVIDIA is widely considered to be one of the technology industry's most desirable employers. We have some of the most forward-thinking and versatile people in the world working with us, and our engineering teams are growing fast in some of the most impactful fields of our generation: AI, Data Engineering, Data Science. If you're a creative engineer who enjoys autonomy and shares our passion for technology, we want to hear from you.\n\nYour base salary will be determined based on your location, experience, and the pay of employees in similar positions. The base salary range is 248,000 USD - 379,500 USD.\n\nYou will also be eligible for equity and benefits.\n\nApplications for this job will be accepted at least until June 26, 2026.\n\nThis posting is for an existing vacancy.\n\nNVIDIA uses AI tools in its recruiting processes.\n\nNVIDIA is committed to fostering an inclusive work environment and proud to be an equal opportunity employer. As we highly value diversity in our current and future employees, we do not discriminate (including in our hiring and promotion practices) on the basis of race, religion, color, national origin, gender, gender expression, sexual orientation, age, marital status, veteran status, disability status or any other characteristic protected by law.\n\n#deeplearning", "has_role_fields": true, "auto": {"category": "job", "role_type": "data scientist", "seniority": "senior", "engagement_type": "full_time", "role_category": "data_scientist", "industry": "hardware_semiconductor", "remote_type": "bay_area", "company_stage": "public", "spam_risk": "clean", "deadline": "2026-06-26", "tag_confidence": 0.95, "content_quality": 9.0}}, {"seq": 6, "dbid": 15759, "bucket": "Job", "title": "Senior Software Engineer", "source": "wellfound_search", "location": "San Francisco", "url": "https://wellfound.com/company/mithrl-1/jobs/senior-software-engineer", "raw": "$175k – $220k, full-time, via role search: ai-engineer\n**ABOUT MITHRL**\n\n*We imagine a world where new medicines reach patients in months, not years, and where scientific breakthroughs happen at the speed of thought.*\n\nMithrl is building the world’s first commercially available AI Co-Scientist. It is a discovery engine that transforms messy biological data into insights in minutes. Scientists ask questions in natural language, and Mithrl responds with real analysis, novel targets, hypotheses, and patent-ready reports.\n\n**Our traction speaks for itself:**\n\n- 12X year-over-year revenue growth\n- Trusted by leading biotechs and big pharma across three continents\n- Driving real breakthroughs from target discovery to patient outcomes.\n\n**ABOUT THE ROLE**\n\nWe are hiring a **Senior Full Stack Engineer** to help build, scale, and evolve the core Mithrl product. This is a highly product-oriented engineering role with deep ownership across frontend, backend, and system design. You will work closely with product, design, ML, and scientific teams to turn complex scientific workflows into intuitive, high-performance software used daily by world-class researchers.\n\nAs a senior engineer, you will be responsible not just for execution, but for **technical direction, architectural decisions, and setting engineering standards**. You will own features end-to-end, from initial concept through production, iteration, and scale. This role requires strong full-stack engineering fundamentals, a bias toward shipping, and the ability to operate comfortably in ambiguous, fast-moving environments.\n\nIf you enjoy building real products used by sophisticated users, thinking deeply about system design and user experience, and taking ownership of critical parts of a fast-growing platform, this role is an ideal match.\n\n**WHAT YOU WILL DO**\n\n- Design, build, and maintain core Mithrl product features across frontend and backend\n- Own end-to-end feature development, from product requirements to production deployment and iteration\n- Build intuitive user interfaces that abstract complex scientific and data workflows\n- Develop scalable backend services, APIs, and data pipelines that power the Mithrl platform\n- Collaborate closely with product, design, ML, and scientific teams to translate user needs into technical solutions\n- Make architectural decisions that balance speed, scalability, reliability, and developer velocity\n- Improve system performance, reliability, and observability as usage and data volumes grow\n- Write clean, maintainable, and well-tested code that sets a high bar for quality\n- Mentor junior engineers and contribute to raising the overall engineering bar\n- Participate in technical planning, code reviews, and ongoing platform evolution\n\n**WHAT YOU BRING**\n\nRequired Qualifications\n\n- 7+ years of professional software engineering experience\n- Strong full-stack engineering experience with Python and React in production environments\n- Proficiency in Django for building backend APIs, services, and data-intensive systems\n- Strong experience building modern frontend applications using React\n- Experience designing and working with GraphQL APIs, including schema design, performance considerations, and client-server data modeling\n- Experience designing and working with scalable systems, databases, and data-intensive applications\n- Strong understanding of system design, software architecture, and engineering best practices\n- Experience shipping and owning production systems used by real customers\n- Ability to work effectively in fast-paced, ambiguous environments\n- Strong problem solving skills and a product-oriented mindset\n- Excellent communication skills and ability to collaborate cross-functionally\n\nNice to Have\n\n- Experience building products for technical or scientific users\n- Familiarity with data-heavy, analytics, or ML-enabled platforms\n- Experience with cloud infrastructure such as AWS, GCP, or Azure\n- Experience mentoring or leading other engineers\n- Exposure to biotech, life sciences, or R&D workflows\n\n**WHAT YOU WILL LOVE AT MITHRL**\n\n- High ownership and impact: You will own meaningful parts of a category-defining product used by leading pharma and biotech organizations. Your work will directly shape how scientists interact with AI and data on a daily basis\n- Team: Join a tight-knit, talent-dense team of engineers, scientists, and builders\n- Culture: We value consistency, clarity, and hard work. We solve hard problems through focused daily execution\n- Speed: We ship fast (2x/week) and improve continuously based on real user feedback\n- Location: Beautiful SF office with a high-energy, in-person culture\n- Benefits: Comprehensive PPO health coverage through Anthem (medical, dental, and vision) + 401(k) with top-tier plans\n\n**We encourage you to apply even if you do not believe you meet every single qualification.** Not all strong candidates will meet every single qualification as listed. Research shows that people who identify as being from underrepresented groups are more prone to experiencing imposter syndrome and doubting the strength of their candidacy, so we urge you not to exclude yourself prematurely and to submit an application if you’re interested in this work. We think AI systems like the ones we’re building have enormous social and ethical implications. We think this makes representation even more important, and we strive to include a range of diverse perspectives on our team.", "has_role_fields": true, "auto": {"category": "job", "role_type": "senior full stack engineer", "seniority": "senior", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "biotech_health", "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": null, "deadline": null, "tag_confidence": 0.85, "content_quality": 6.5}}, {"seq": 7, "dbid": 16271, "bucket": "Job", "title": "Senior Mechanical Engineer", "source": "wellfound_search", "location": "San Francisco", "url": "https://wellfound.com/company/pax-labs/jobs/senior-mechanical-engineer", "raw": "$180k – $235k, full-time, via role search: data-engineer\n**THE COMPANY**\n\nAt PAX, we’re on a mission to enhance people’s lives through exceptional consumer experiences—honoring the plant through pioneering innovation, science-backed quality, and award-winning design. For nearly two decades, PAX has delivered high performance products crafted for precision, purity, and consistency that are trusted by millions worldwide.\n\nOur culture is built on putting people at the center of everything we do, making an impact together, and having fun along the way. We believe exceptional products, a thriving employee experience, and strong operational rhythms go hand-in-hand. PAX has been recognized for its brand, culture and products by The New York Times’ Wirecutter, TIME, Fast Company, GQ, Gear Patrol, mg Magazine, High Times, and many more. PAX is certified Plastic Negative across all product lines by rePurpose Global, ensuring that twice as much plastic is removed from nature as is used in its products.\n\n**ROLE AND RESPONSIBILITIES**\n\nReporting to the Director, Mechanical Engineering, the Senior Mechanical Engineer will be responsible for designing new products that are innovative, cost efficient, reliable, and ship on schedule. You will troubleshoot and make improvements to existing products, and work closely with other members of the engineering staff to create optimal solutions to difficult design, structural, thermal, and battery life issues. You will be comfortable sketching and prototyping new ideas and be familiar with engineering best practices, concepts and procedures. You may lead and direct the work of others.\n\nOur products are hailed for their beautiful design language, high quality and reliability, and we lead the industry with product and technology innovations. Our Mechanical Engineers are responsible for the architecture and detailed design of all of our products, working closely with the rest of the Hardware team to achieve the product vision for the device.  This role is critical to leading the development of future products.\n\n**As the PAX Senior Mechanical Engineer, you will:**\n\n- Integrate with cross-functional teams to create high quality products that delight our customers.\n- Work with ID to assess product features for manufacturability and recommend capable processes, equipment, etc.\n- Lead the development of the mechanical product architectures, assemblies/modules, parts, and accessories\n- Detailed design of mechanical components, including complex assemblies and sub-systems.\n- Conduct rapid feasibility studies to design for mechanical robustness, schedule, and cost.\n- Oversee internal and external prototyping.\n- Facilitate design reviews and drive best practices\n- Collaborate closely with Reliability and Failure Analysis teams to root cause and resolve issues\n- Work directly with part suppliers on DFM, tooling kick-off, tool bring-up, and tool/part qualification.\n- Collaborate with local and overseas engineering and manufacturing teams to qualify tooling and define visual quality requirements.\n- Work directly with our CM partners in support of system assembly build activities.\n- Collaborate extensively with Manufacturing Engineering on our Supply Chain team to develop and validate fixture\n\n**WHAT WE LOOK FOR IN YOU**\n\n- 10+ years in consumer products and/or other product development\n- Deeply technical mechanical engineering background\n- Strong track record of shipping products from concept to mass production\n- Expert level proficiency in Solidworks\n- Experience working with Asian manufacturing and supply chains including travel to manufacturing sites\n- Excellent organizational, communication, presentation, and data analytics skills\n- Experience in designing consumer oriented products using a broad range of processes and materials, with an emphasis on cosmetic plastic molding and metal parts (sheet metal, CNC, extrusion, etc.).\n- Experience with the development and integration of electro-mechanical components, such as flex circuits, batteries, and antenna.\n- International travel is expected (\\< 20%)\n\n **Our Ideal Candidate Will:**\n\n- Have seen multiple product cycles from start to finish and shipping consumer hardware at high volume (7 figures in terms of annual units).\n- Have extremely strong XFNL collaboration skills and works super well with others.\n- Be a creative problem solver and make data-driven decisions.\n- Have one or more of the following additional skillsets: strong simulation/FEA skills, thermal simulation and heat transfer experience\n\n**EDUCATION**\n\n- BS in ME, related discipline, or demonstrated equivalent experience\n- MS or higher preferred\n\n**PAX LABS PERKS & BENEFITS**\n\n- Competitive compensation, equity & bi-annual performance reviews\n- Fully funded comprehensive medical, dental, and vision coverage\n- 401K plan\n- Generous PTO policy\n- Paid Parental Leave\n- Monthly wellness reimbursement\n- Cell Phone reimbursement\n- Employee Purchase Program for discounted PAX devices\n- Weekly catered lunch, endless snacks and beverages\n- Dog Friendly HQ in the Mission District of San Francisco\n- Employee Assistance Program including access to online legal support\n\n**COMPENSATION**\n\nIn addition to the benefits above, the salary for this role is $180,000 – $235,000 + equity. This represents what we believe, in good faith, this role will pay. The final pay will depend on many factors, including years and depth of experience, level, and location of the employee. \n\n**PAX VALUES**\n\n- **Put Consumers First** - We are here to enhance their lives. We put their needs first in everything we do. We work together to deliver unique solutions for their benefit.\n- **Build a Community** - We are active and beneficial builders of a global community. We collaborate together to support sustainability, well-being and social equity efforts—both internally and externally—to establish cannabis as a force for good.\n- **Innovate with Passion** - We are passionate about enhancing the cannabis experience by making it positive, accessible and intuitive. We set the standards, innovate for consumers and find the yes as a team.\n- **Be the Solution and Collaborate** - We work as a team to achieve winning outcomes, knowing we each individually are the solution, but can only succeed together.\n- **Lead with Humility and Transparency** - We stay open and humble in everything we do. We value learning from each other, and cultivate transparency in our culture and products.\n\nWe will ensure that individuals with disabilities are provided reasonable accommodation to participate in the job application or interview process, to perform essential job functions, and to receive other benefits and privileges of employment. Please contact us to request accommodation.", "has_role_fields": true, "auto": {"category": "job", "role_type": "mechanical engineer", "seniority": "senior", "engagement_type": "full_time", "role_category": "other", "industry": "consumer_gaming", "remote_type": "hyperlocal_sf", "company_stage": null, "spam_risk": null, "deadline": null, "tag_confidence": 0.9, "content_quality": 1.5}}, {"seq": 8, "dbid": 17015, "bucket": "Job", "title": "Principal Software Engineer ADEM (ADEM - Autonomous Digital Experience Management) - Windows", "source": "indeed_apify_old", "location": "Santa Clara, CA 95054", "url": "https://www.indeed.com/viewjob?jk=6fa16a98759cd4b1", "raw": "Full-time, $147,000 - $237,500 a year\nSanta Clara, California, United States Product Engineering Ref ID: JR-019097\n\nOur Mission\n\nAt Palo Alto Networks®, we’re united by a shared mission—to protect our digital way of life. We thrive at the intersection of innovation and impact, solving real-world problems with cutting-edge technology and bold thinking. Here, everyone has a voice, and every idea counts. If you’re ready to do the most meaningful work of your career alongside people who are just as passionate as you are, you’re in the right place.\n\nWho We Are\n\nIn order to be the cybersecurity partner of choice, we must trailblaze the path and shape the future of our industry. This is something our employees work at each day and is defined by our values: Disruption, Collaboration, Execution, Integrity, and Inclusion. We weave AI into the fabric of everything we do and use it to augment the impact every individual can have. If you are passionate about solving real-world problems and ideating beside the best and the brightest, we invite you to join us!\n\nWe believe collaboration thrives in person. That’s why most of our teams work from the office full time, with flexibility when it’s needed. This model supports real-time problem-solving, stronger relationships, and the kind of precision that drives great outcomes.\n\nJob Summary\n\nYour Career\n\nPalo Alto Networks' ADEM (Autonomous Digital Experience Management) group is seeking an accomplished Principal Engineer with expertise in developing client-side software for Windows. You will be part of a world-class engineering team working on innovative solutions in the ADEM domain, focusing on building robust, efficient, and scalable agents for monitoring and enhancing digital experiences. You will collaborate with a multi-functional team of engineers to design and develop software systems that address complex challenges in the ADEM space, driving performance and reliability across diverse environments.\n\nYour Impact\n\nResponsible for the complete software development process including requirement analysis, design, development, deployment, and support\n\nCollaborate with other cross functional teams in order to create tight integrations of product features and infrastructure\n\nWrite clean, testable, readable, scalable and maintainable code that scales and performs well for thousands of customers\n\nParticipate actively and be a factor to design and development discussions\n\nIdentify areas for improvement within the team and actively push for positive change through new initiatives or optimizations\n\nQualifications\n\nYour Experience\n\n8+ years of solid experience in programming, design, and development, with a focus on client-side software for Windows.\n\nStrong expertise in Windows system-level programming, including Win32 APIs, Windows Services, IPC, registry, file systems, and process/thread management.\n\nExpert-level programming skills in C++, C#, or .NET with experience building native Windows desktop applications and endpoint agents.\n\nHands-on experience with Windows internals and platform technologies such as WMI, ETW, COM, WFP, and background service architecture.\n\nExperience building multithreaded, high-performance, and resource-efficient applications with strong focus on reliability and scalability.\n\nStrong understanding of networking fundamentals including TCP/IP, HTTP/HTTPS, socket programming, TLS/SSL, and VPN technologies.\n\nStrong debugging and troubleshooting skills using tools such as WinDbg, ProcMon, ETW tracing, crash dump analysis, and performance profiling tools.\n\nExperience with enterprise deployment, CI/CD pipelines, automated testing, code signing, and secure software development practices for Windows applications.\n\nExperience building cross-platform endpoint or desktop applications spanning Windows and macOS environments is a strong plus.\n\nBS/MS in Computer Science, Computer Engineering, or equivalent military experience required\n\nCompensation Disclosure\n\nThe compensation offered for this position will depend on qualifications, experience, and work location. For candidates who receive an offer at the posted level, the starting base salary (for non-sales roles) or base salary + commission target (for sales/com-missioned roles) is expected to be the annual range listed below. The offered compensation may also include restricted stock units and a bonus.\n\n$147,000.00 - $237,500.00/yr\n\nOur Commitment\n\nWe’re trailblazers that dream big, take risks, and challenge cybersecurity’s status quo. It’s simple: we can’t accomplish our mission without diverse teams innovating, together.\n\nWe are committed to providing reasonable accommodations for all qualified individuals with a disability. If you require assistance or accommodation due to a disability or special need, please contact us at accommodations@paloaltonetworks.com.\n\nPalo Alto Networks is an equal opportunity employer. We celebrate diversity in our workplace, and all qualified applicants will receive consideration for employment without regard to age, ancestry, color, family or medical care leave, gender identity or expression, genetic information, marital status, medical condition, national origin, physical or mental disability, political affiliation, protected veteran status, race, religion, sex (including pregnancy), sexual orientation, or other legally protected characteristics.\n\nAll your information will be kept confidential according to EEO guidelines.\n\nIs role eligible for Immigration Sponsorship? No. Please note that we will not sponsor applicants for work visas for this position.", "has_role_fields": true, "auto": {"category": "job", "role_type": "software engineer", "seniority": "staff+", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "enterprise_saas", "remote_type": "bay_area", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.95, "content_quality": 9.0}}, {"seq": 9, "dbid": 19449, "bucket": "Job", "title": "AI Platform Engineer, Backend", "source": "indeed_radius", "location": "San Francisco, CA", "url": "https://www.indeed.com/m/viewjob?jk=6dcd3c5b44130691&from=serp&tk=1jsje57rhi9er801&xkcb=SoAe67M3hTUa3hQpSJ0abzkdCdPP", "raw": "Full-time\nAbout Brain Co.\n\nBrain Co. is an applied AI startup co-founded by Jared Kushner and Elad Gil, and backed by leading Silicon Valley builders including Patrick Collison and Andrej Karpathy.\n\nWe are building AI applications for the world’s most important institutions, delivering impact on real-world problems across governments, healthcare systems, and critical industries.\n\nOur progress so far:\n\nAutomated construction permitting for a sovereign government 80% faster, unlocking $375M+ in value\n\nOptimized supply chains for a leading global energy company 30% lower cost, 99% reliability, preventing $100M+ in losses\n\nStreamlined hospital patient care across national health systems 40% better outcomes, 80% less admin work\n\nCompany momentum:\n\nRaised a $55M Series A from leading investors\n\nBuilt a team of 70+ AI experts from Tesla, Google DeepMind, NVIDIA, and Databricks\n\nAt Brain Co., we focus on applying frontier AI to real institutional challenges, working alongside governments, healthcare systems, and critical industries to modernize how essential services operate.\n\nWe are looking for leaders who want to help bring new technology into institutions that impact millions of people.\n\nAbout the role:\n\nAs a Backend Engineer at Brain Co., you'll own the systems that power our AI platform end-to-end, from architecture and design to deployment and maintenance. You'll build reliable, production-grade infrastructure for enterprise and government environments, solve complex problems from first principles, and work closely with teams across Product, ML, and Infrastructure. The work is meaningful: you'll be turning cutting-edge AI into systems that some of the world's most important organizations can actually depend on.\n\nWhat You'll Work On:\n\nOwn it end-to-end: architecture, implementation, deployment, and long-term maintenance.\n\nBuild for real environments, design modular, reusable APIs (REST, gRPC, event-driven) and backend architectures that meet enterprise and government uptime expectations.\n\nThink in first principles, break down complex, open-ended problems into clear technical designs and ship production-ready systems with speed and rigor.\n\nOptimize continuously, improve latency, throughput, and cost efficiency through profiling, thoughtful system design, and iteration.\n\nPartner closely with Product, ML, Infrastructure, and customer-facing teams, building systems that are intuitive, reliable, and developer-friendly.\n\nYou Might Be a Great Fit If You…\n\n3+ years building production systems with strong fundamentals in distributed systems (consistency, availability, failure modes, retries, idempotency) and deep proficiency in Go, TypeScript, Rust, Python, or similar.\n\nProven ability to design from first principles, with experience building shared infrastructure, internal platforms, or developer-facing services and strong intuition for DX and long-term maintainability.\n\nExperience owning services with real uptime responsibility, plus familiarity with observability tooling (metrics, logging, tracing) and incident response.\n\nTrack record designing, operating, and evolving APIs and services at scale.\n\nWays you might stand out:\n\nExperience with AI/ML platforms, inference systems, or data-intensive pipelines.\n\nFamiliarity with Kubernetes and cloud-native service deployment.\n\nExposure to multi-tenant, regulated, or government environments.\n\nExperience with real-time or streaming data systems.\n\nWhy Join Us\n\nCollaborate with industry veterans from Tesla, DeepMind, Databricks, and more\n\nAccelerate your career with ownership based on impact, not tenure\n\nEarn competitive compensation + meaningful equity in a high-growth company\n\nThrive in a culture built on speed, curiosity, and impact\n\nBenefits\n\nCompetitive salary plus equity\n\nDaily lunches\n\nCommuter benefits\n\n401(k)\n\nMedical, Dental and Vision\n\nUnlimited PTO", "has_role_fields": true, "auto": {"category": "job", "role_type": "backend engineer", "seniority": "mid", "engagement_type": "full_time", "role_category": "software_engineer", "industry": "ai_ml", "remote_type": "hyperlocal_sf", "company_stage": "series_a_b", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 10, "dbid": 20551, "bucket": "Job", "title": "Senior Accountant, Accounts Payable", "source": "greenhouse", "location": "Dallas, TX", "url": "https://coreweave.com/careers/job?4693203006&board=coreweave&gh_jid=4693203006", "raw": "CoreWeave is The Essential Cloud for AI™. Built for pioneers by pioneers, CoreWeave delivers a platform of technology, tools, and teams that enables innovators to build and scale AI with confidence. Trusted by leading AI labs, startups, and global enterprises, CoreWeave combines superior infrastructure performance with deep technical expertise to accelerate breakthroughs and turn compute into capability. Founded in 2017, CoreWeave became a publicly traded company (Nasdaq: CRWV) in March 2025. Learn more at \nwww.coreweave.com\n.\n\nWhat You'll Do:\n\nThe \nGlobal Business Services (GBS)\n team at CoreWeave is responsible for centralizing, standardizing, and scaling foundational business processes across Finance, Procurement, and HR. As part of GBS, the Accounts Payable function plays a critical role in CoreWeave's Procure-to-Pay (P2P) process, ensuring operational excellence, strong controls, and high-quality service delivery as the company scales globally in a public-company environment.\n\nAs a Senior AP Accountant, Direct Spend, you are a critical member of CoreWeave's GBS organization, responsible for executing day-to-day accounts payable operations while supporting the end-to-end Procure-to-Pay (P2P) process. This role blends hands-on operational expertise with leadership in process standardization and continuous improvement initiatives. Partnering closely with GBS leadership, Accounting, Procurement, and external vendors, you will ensure accurate, timely, and scalable AP operations that align with CoreWeave's hyper-growth trajectory and SOX-compliant framework.\n\nWho You Are:\n\n5+ years of progressive accounts payable experience focused on direct spend management (hard requirement)\n\nDemonstrated experience supporting Procure-to-Pay (P2P) processes end-to-end within a shared services, GBS, or corporate accounting environment\n\nStrong working knowledge of internal controls, audit support, and SOX-compliant AP operations\n\nHands-on experience managing 3-way match, high-volume invoice processing, payment batch runs, and related banking functions\n\nProven ability to support month-end close activities, including AP accruals and reconciliations\n\nHands-on experience with ERP systems (e.g., NetSuite, SAP, Oracle, Coupa)\n\nAdvanced Excel skills for reporting, reconciliations, and data analysis\n\nPreferred:\n\nPO Matching & Invoice Processing (3-way match, exception queue, GR validation)\n\nExperience working within a Global Business Services or Shared Services model\n\nExposure to AP automation, workflow tools, or process transformation initiatives\n\nControls & Process Improvement (PO compliance, audit support, Coupa/NetSuite optimization)\n\nVendor Management & Reconciliation (statement recons, billing gap detection)\n\nExperience partnering cross-functionally with Procurement and Finance stakeholders\n\nExperience working with Supply Chain\n\nWondering if you're a good fit? We believe in investing in our people, and value candidates who can bring their own diversified experiences to our teams – even if you aren't a 100% skill or experience match. Here are a few qualities we've found compatible with our team. If some of this describes you, we'd love to talk.\n\nYou love building structured, repeatable processes that scale globally\n\nYou're curious about how GBS models drive efficiency and service quality\n\nYou're an expert in accounts payable fundamentals and P2P best practices\n\nWhy CoreWeave?\n\nAt CoreWeave, we work hard, have fun, and move fast! We're in an exciting stage of hyper-growth that you will not want to miss out on. We're not afraid of a little chaos, and we're constantly learning. Our team cares deeply about how we build our product and how we work together, which is represented through our core values:\n\nBe Curious at Your Core\n\nAct Like an Owner\n\nEmpower Employees\n\nDeliver Best-in-Class Client Experiences\n\nAchieve More Together\n\nWe support and encourage an entrepreneurial outlook and independent thinking. We foster an environment that encourages collaboration and enables the development of innovative solutions to complex problems. As we get set for takeoff, the organization's growth opportunities are constantly expanding. You will be surrounded by some of the best talent in the industry, who will want to learn from you, too. Come join us!\n\nThe base salary range for this role is $98,000 to $130,000. The starting salary will be determined based on job-related knowledge, skills, experience, and market location. We strive for both market alignment and internal equity when determining compensation. In addition to base salary, our total rewards package includes a discretionary bonus, equity awards, and a comprehensive benefits program (all based on eligibility).\nWhat We Offer\n\nThe range we’ve posted represents the typical compensation range for this role. To determine actual compensation, we review the market rate for each candidate which can include a variety of factors. These include qualifications, experience, interview performance, and location.\n\nIn addition to a competitive salary, we offer a variety of benefits to support your needs. The benefits below reflect our US-based offerings; for roles in other locations, benefits vary and are shared during the hiring process. These include:\n\nMedical, dental, and vision insurance - 100% paid for by CoreWeave\n\nCompany-paid Life Insurance \n\nVoluntary supplemental life insurance \n\nShort and long-term disability insurance \n\nFlexible Spending Account\n\nHealth Savings Account\n\nTuition Reimbursement \n\nAbility to Participate in Employee Stock Purchase Program (ESPP)\n\nMental Wellness Benefits through Spring Health \n\nFamily-Forming support provided by Carrot\n\nPaid Parental Leave \n\nFlexible, full-service childcare support with Kinside\n\n401(k) with a generous employer match\n\nFlexible PTO\n\nCatered lunch each day in our office and data center locations\n\nA casual work environment\n\nA work culture focused on innovative disruption\n\nCalifornia Applicants\n\nCalifornia Consumer Privacy Act \n\nEqual Opportunity & Accommodations\n\nCoreWeave is an equal opportunity employer, committed to fostering an inclusive and supportive workplace. All qualified applicants and candidates will receive consideration for employment without regard to race, color, religion, sex, disability, age, sexual orientation, gender identity, national origin, veteran status, or genetic information.\n\nAs part of this commitment and consistent with the \nAmericans with Disabilities Act (ADA)\n, CoreWeave will ensure that qualified applicants and candidates with disabilities are provided reasonable accommodations for the hiring process, unless such accommodation would cause an undue hardship. If reasonable accommodation is needed, please contact: \ncareers@coreweave.com\n.\n\nExport Control Compliance\n\nThis position requires access to export controlled information.  To conform to U.S. Government export regulations applicable to that information, applicant must either be (A) a U.S. person, defined as a (i) U.S. citizen or national, (ii) U.S. lawful permanent resident (green card holder), (iii) refugee under 8 U.S.C. § 1157, or (iv) asylee under 8 U.S.C. § 1158, (B) eligible to access the export controlled information without a required export authorization, or (C) eligible and reasonably likely to obtain the required export authorization from the applicable U.S. government agency.  CoreWeave may, for legitimate business reasons, decline to pursue any export licensing process.", "has_role_fields": true, "auto": {"category": "job", "role_type": "accounts payable accountant", "seniority": "senior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "ai_ml", "remote_type": "other", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 11, "dbid": 20813, "bucket": "Job", "title": "Senior Cloud Network Engineer ", "source": "greenhouse", "location": "Bristol, UK", "url": "https://job-boards.greenhouse.io/graphcore/jobs/8561919002", "raw": "About Graphcore\n \n\nHow often do you get the chance to build a technology that transforms the future of humanity?\n \n\nAt Graphcore, we’re building the future of AI compute.We’re a team of semiconductor, software and AI experts, with deep experience in creating the complete AI compute stack - from silicon and software to infrastructure at datacenter scale. As part of the SoftBank Group, backed by significant long-term investment, we are delivering key technology into the fast-growing SoftBank AI ecosystem.To meet the vast and exciting AI opportunity, Graphcore is expanding its teams around the world.We are bringing together the brightest minds to solve the toughest problems, in a place where everyone has the opportunity to make an impact on the company, our products and the future of artificial intelligence.\n \n \n\nJob Summary \n \nWe are looking for a \nSenior \nNetwork \nEngineer \nto join our Cloud \nPlatform\n Team\n and help develop and deploy clouds and services\n. Working closely with our colleagues in \nSoftware \nPlatform, Datacentre Operations and Product Development teams, you will \ndeploy services on\nour fleet of \ncutting-edge\n AI systems. As part of our \nSoftware \nPlatform organisation, you will be involved in the cloud integration, validation, performance benchmarking, optimisation, and development of our high-performance AI solutions\n.  \nThese include in-house AI systems alongside off-the-shelf high-performance servers, \nswitches\n and storage solutions\n.  \nThis is a hand-on \ntechnical \nrole\n \nrequiring a solid background in \nthe use of cloud \ninfrastructure, deployment using Infrastructure-as-Code, \nobservability, \nhigh-performance \nnetworking\nand storage systems\n.  \nYou may have been working in an IT organisation, a datacentre, a cloud provider or as a developer of orchestration or cloud \nservices\n.  \n \n\n \n\nThe Software Platform team at Graphcore\n \n\nWe build \nGraphcore\n products into large-scale AI solutions for our customers and the Cloud \nPlatform\n Team \nis responsible for\n providing such systems \nto both\n internal users via private clouds\n and customers via our own public clouds\n.  \nOften the internal systems will be using and developing pre-release hardware and software\n, so \nit’s\n vital you are comfortable with unproven components.\n \n\n \n\nResponsibilities and Duties\n \n \n\nDevelop \nand \noperate\n \nhigh-performance ethernet infrastructure \non our private clouds and support internal users in their use.\n \nYou will turn\n \nend-user and product requirements into deployed services.\n \n\nHelp to \nbuild automation to \ncollect and analyse metrics and other data \nfrom the \nnetwork \ninfrastructure\n \nto support \nclear \nidentification and \nreporting of any issues\n.  \nWork with users to provide information \nof any product-related issues \nto Engineering\n and QA departments\n.\n \n\nWork with our Datacentre Operations Engineers to \nmaintain\n, tune\n and \noperate\n the fleet of AI systems at peak performance in our private clouds.\n \n\nWork with external vendors of off-the-shelf switches, \nservers\n and storage solutions to integrate 3\nrd\n party products into our Cloud Reference Design\n, with a focus on network performance, \nautomation\n and resilience.\n \n\n \n\nSkills and Experience (all required)\n \n\nBachelor's degree or equivalent practical experience in a relevant subject.\n \n\nSignificant hands-on experience with 1 or more vendor’s high-end \n(100Gb/s+) \nethernet \nswitch \nsolutions.\n \n\nExperience \nmanaging\n on-\npremises\n or private-cloud environments\n. \n \n\nSolid software engineering or IT experience with a proven \ntrack record\n of delivering technical output as an individual contributor.\n \n\nExperience \nworking\n in an AGILE \nand SCRUM \nframework\n, including \nunderstanding of \npriorities, risks, issues, \nimpacts\n and constraints\n.\n \n \n\nStrong\n proven L\ninux scripting ability\n (bash, python, awk, \nsed\n).\n \n\nStrong proven Linux system administration (\nU\nbuntu, RHEL and variants).\n \n\nExperience with a version control system (preferably G\nit\n)\n and using it to manage system configuration or automation.\n \n\nExperience with Continuous Integration or testing pipelines using GitLab, GitHub or similar.\n \n\nA solid hands-on understanding of the technologies underpinning cloud services (\nAPIs, \nvirtualisation of CPUs, IO, systems)\n and how they relate to high-performance networking.\n \n\nExperience with \nIAC \nautomation tools (\nTerraform/\nOpenTofu\n, Ansible\n).\n \n\nExperience with container deployment and management\n tools (e.g. docker).\n \n\nExperience with solutions for monitoring and observability. e.g. \nGrafana\n, \nPrometheus\n, \nOpenSea\nr\nch\n/\nElasticSearch\n, Loki\n. \n \n\nGood communication and presentation skills\n,\n and experience dealing with end-users\n of IT services.\n \n\nAn ability to work independently on critical infrastructure \nwith minimal\n oversight\n, and with a focus on end-user availability\n. \n \n\n \n\nDesirable but not required:\n \n\nExperience with \nOpenstack\n cloud platform\ns.\n \n\nExperience with High Performance Computing\n (HPC)\n environments\n using SLURM or similar batch workload solutions.\n \n\nExperience with hardware offloading on RDMA-capable NICs and how that integrates with \nvirtual networking on \nOpen V-switch\n, KVM/QEMU.\n \n\nExperience with \nmanaging production \nKubernetes \nclusters and workloads\n with an automation tool such as \nArgoCD\n.\n \n\n \n\nBenefits\n\nIn addition to a competitive salary, Graphcore offers flexible working, a generous annual leave policy, private medical insurance and health cash plan, a dental plan, pension (matched up to 5%), life assurance and income protection. We have a generous parental leave policy and an employee assistance programme (which includes health, mental wellbeing, and bereavement support). We offer a range of healthy food and snacks at our central Bristol office and have our own barista bar! We welcome people of different backgrounds and experiences; we’re committed to building an inclusive work environment that makes Graphcore a great home for everyone. We offer an equal opportunity process and understand that there are visible and invisible differences in all of us. We can provide a flexible approach to interview and encourage you to chat to us if you require any reasonable adjustments.\n\n \n\nSponsorship\n\nApplicants for this position must hold the right to work in the UK. Unfortunately at this time, we are unable to provide visa sponsorship or support for visa applications.", "has_role_fields": true, "auto": {"category": "job", "role_type": "cloud network engineer", "seniority": "senior", "engagement_type": "full_time", "role_category": "devops_infra_engineer", "industry": "hardware_semiconductor", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 9.0}}, {"seq": 12, "dbid": 20821, "bucket": "Job", "title": "Senior Engineering Program Coordinator ", "source": "greenhouse", "location": "Austin, Texas, United States", "url": "https://job-boards.greenhouse.io/graphcore/jobs/8552045002", "raw": "About us\n\nGraphcore is one of the world’s leading innovators in Artificial Intelligence compute.\n\nIt is developing hardware, software and systems infrastructure that will unlock the next generation of AI breakthroughs and power the widespread adoption of AI solutions across every industry.\n\nAs part of the SoftBank Group, Graphcore is a member of an elite family of companies responsible for some of the world’s most transformative technologies. Together, they share a bold vision: to enable Artificial Super Intelligence and ensure its benefits are accessible to everyone.\n\nGraphcore’s teams are drawn from diverse backgrounds and bring a broad range of skills and perspectives. A melting pot of AI research specialists, silicon designers, software engineers and systems architects, Graphcore brings together people who are passionate about solving complex technical challenges.\n\nJob Summary\n\nReporting to an Engineering Program Manager or Engineering Operations leader, the Senior Engineering Program Coordinator supports the planning, coordination and execution of engineering programs across multiple teams. The role is responsible for maintaining program schedules, tracking actions and dependencies, facilitating communication between stakeholders, and helping ensure engineering activities are delivered efficiently and on time. The successful candidate will play a key role in enabling collaboration, improving operational effectiveness and supporting the successful delivery of engineering objectives.\n\nThe Team\n\nThe Engineering Operations and Program Management team works closely with engineering leaders, technical specialists and business stakeholders to support the delivery of complex technology programs. The team provides structure, coordination and visibility across projects, helping engineering teams align priorities, manage dependencies and execute effectively. Working across multiple disciplines, the team enables efficient planning, communication and reporting to support successful outcomes.\n\nResponsibilities and Duties\n\nCoordinate engineering program activities across multiple teams and stakeholders.\n\nMaintain project plans, schedules, milestones, risks, issues and action trackers.\n\nOrganise and facilitate regular program meetings, reviews and status updates.\n\nTrack progress against agreed deliverables and highlight risks or delays in a timely manner.\n\nSupport program managers and engineering leaders with planning, reporting and governance activities.\n\nEnsure actions, decisions and dependencies are documented and communicated effectively.\n\nPrepare dashboards, reports and presentations to provide clear visibility of program status.\n\nAssist with resource planning, workload tracking and coordination across engineering groups.\n\nDrive follow-up activities to ensure commitments are completed and stakeholders remain aligned.\n\nContribute to continuous improvement of program management processes, tools and ways of working.\n\nSupport onboarding of new team members into program processes and operating rhythms.\n\nCollaborate with cross-functional teams to help resolve operational and delivery challenges.\n\nCandidate Profile\n\nEssential\n\n7 years of experience coordinating projects, programs or operational activities within an engineering, technology or technical environment.\n\nStrong organisational skills with the ability to manage multiple priorities and deadlines simultaneously.\n\nExperience maintaining schedules, action trackers, risk logs and status reporting.\n\nExcellent written and verbal communication skills with the ability to engage a wide range of stakeholders.\n\nStrong attention to detail and commitment to delivering accurate, high-quality work.\n\nProficiency with common project management, collaboration and productivity tools.\n\nAbility to work independently while coordinating effectively across distributed teams.\n\nA proactive approach to problem solving and continuous improvement.\n\nDesirable\n\nExperience supporting hardware, software, semiconductor or other complex engineering programs.\n\nFamiliarity with project management methodologies and governance practices.\n\nExperience creating dashboards, metrics and management reporting.\n\nUnderstanding of engineering product development lifecycles.\n\nExperience working within a fast-paced technology organization.\n\nUSA Benefits\nIn addition to a competitive salary, Graphcore offers flexible working and a comprehensive benefits package designed to support your health, wellbeing and financial future. Our benefits include medical, dental and vision coverage, Flexible Spending Accounts (FSAs), Health Savings Accounts (HSAs), disability and life insurance, a 401(k) retirement plan, commuter benefits, wellness services and an Employee Assistance Programme (EAP). We welcome people of different backgrounds and experiences; we're committed to building an inclusive work environment that makes Graphcore a great home for everyone. We offer an equal opportunity process and understand that there are visible and invisible differences in all of us. We can provide a flexible approach to interview and encourage you to chat to us if you require any reasonable adjustments.", "has_role_fields": true, "auto": {"category": "job", "role_type": "Engineering Program Coordinator", "seniority": "senior", "engagement_type": "full_time", "role_category": "ops_admin", "industry": "hardware_semiconductor", "remote_type": "other", "company_stage": "growth", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 13, "dbid": 24748, "bucket": "Job", "title": "Clinical Nurse (RN), Cardiovascular Transplant Surgery - 1.0 FTE, Days (10HR)", "source": "indeed_radius", "location": "Palo Alto, CA 94305", "url": "https://www.indeed.com/viewjob?jk=7e546d432d88f7ba", "raw": "Full-time, $96.35 - $111.14 an hour\n1.0 FTE Full time Day - 10 Hour R2657170 Onsite 107078002 CV Transplant Sugery Multi Site Nursing PALO ALTO, 300 Pasteur Dr, California\n\nIf you're ready to be part of our legacy of hope and innovation, we encourage you to take the first step and explore our current job openings. Your best is waiting to be discovered.\n\nDay - 10 Hour (United States of America)\n\nPreferred Qualifications:\n• Strong background in cardiac care/cardiology\n• Minimum of 2 years of experience in the Operating Room, Critical Care Units, Cath Lab, or other relevant clinical settings\n\nThis is a Stanford Health Care job.\n\nA Brief Overview\nThe Clinical Nurse (CN) is an RN who provides hands-on care to patients, practicing in an evidence-based manner, within the Scope of Practice of the California Nursing Practice Act, regulatory requirements, standards of care, and hospital policies. Within that role, the CN performs all steps of the nursing process, including assessing patients; interpreting data; planning, implementing, and evaluating care; coordinating care with other providers; and teaching the patient and family the knowledge and skills needed to manage their care and prevent complications. The CN partners with the patient's family wherever possible, considering all aspects of care, to deliver family centered care. As a professional, monitors the quality of nursing care provided.\n\nThe Clinical Nurse is responsible for his/her own professional development, including licensure, Basic Life Support (BLS) certification, and maintaining current knowledge regarding the assigned patient population.\n\nAs a member of the nursing profession, the Clinical Nurse contributes to the profession of nursing through such activities as teaching others, sharing expertise In unit or hospital.\n\nPlease note: A Nurse who voluntarily agrees to work in a \"weekends only\" position is not eligible for premium pay under Section 17.2.\nOur Clinical Nurse (RN) job classification is represented by the Committee for Recognition of Nursing Achievement (CRONA). CRONA is an independent union for Registered Nurses at Stanford Health Care and Lucile Packard Children's Health Stanford. For more information, please visit the CRONA website at https://www.crona.org/.\n\nNOTE: Advanced Cardiovascular Life Support (ACLS) certification may be required by the cost center in which the position resides. Please check AskHR for a complete listing of those cost centers requiring the ACLS certification.\n\nLocations\nStanford Health Care\n\nWhat you will do\n\nThe Helping Role Establishes Therapeutic Relationships:\nCreates and maintains a climate conducive to healing through being present to the patient and family, identifying and managing discomforts; providing emotional support and information; guiding the patient and family through phases of illness and recovery/passage to death and in accordance with the patient's goals and culture.\nMobilizes the patient's strengths and abilities towards participation in recovery and control over plan of care.\n\nDiagnostic and Monitoring Functions:\nObtains accurate and relevant assessment data and interprets the data as normal vs abnormal. Determines nursing diagnosis. Monitors and evaluates data as frequently as needed based on stability.\n\nPlans and Implements Therapeutic Interventions:\nCollaborates with the patient, family and members of health care team to develop an individualized plan of care. Implements nursing and medical interventions safely. Evaluates effectiveness of interventions and monitors patient for adverse responses and side effects.\n\nTeaching and Coaching, Patient and Staff Teaching:\nAssesses a patient's and family's learning needs and readiness to learn. Teaches needed information for self-care and illness prevention. Adjusts information and expectations based on responses from patient, developmental levels, physiological and psychological condition, and cultural variations.\nTeaches other staff members both incidentally and/or through formal roles such as preceptor or super-user.\n\nEffective Management of Rapidly Changing Situations:\nAbility to rapidly grasp problem situations and respond quickly and appropriately. Identifies the need for and activates emergency protocols.\n\nMonitors and Ensures Quality Healthcare Practices:\nMonitors own practices and assists in monitoring others for practices related to patient and employee safety and compliance to standards and policies. Looks for opportunities for continual improvement in patient care and the work environment.\n\nOrganization and Work Role Functions:\nIntegrates multiple requests and work expectations by setting priorities, delegating tasks appropriately, and seeking assistance as needed.\n\nPriorities:\nContributes to team building through participation in unit programs and meetings; contributes to positive morale, using constructive and effective conflict resolution skills.\n\nManagement and Delegation:\nLearns and utilizes the available technology for communication, documentation, and locating information regarding unusual clinical situations, diagnosis, and treatments.\nContributes to the knowledge and skill of other members of the nursing staff through one or more activities such as formal or informal teaching, participation on Shared Governance groups, professional publications and/or presentations.\n\nEducation:\nAttains knowledge and competence that reflects current nursing practice. Demonstrates commitment to lifelong learning.\n\nCommunication:\nCommunicates effectively in a variety of formats in all areas of practice.\n\nLeadership:\nDemonstrates leadership in the professional practice setting and the profession.\n\nProfessional Practice Evaluation:\nEvaluates own nursing practice in relation to professional practice standards and guidelines, relevant statutes, rules and regulations.\n\nEducation Qualifications\n\nBachelor of Science in Nursing (BSN) from an accredited college or university preferred.\n\nRequired Knowledge, Skills and Abilities\n\nAble to communicate effectively in English.\n\nLicenses and Certifications\n\nCurrent American Heart Association Certification for Basic Life Support for Healthcare Providers .\nCA-RN (Registered Nurse) .\n\nPhysical Demands and Work Conditions\n\nPhysical Demands\n\nFrequent (please list each item under Comments). The work involves considerable exertion such as frequent lifting of\npatients and equipment, bending and stooping, and walking. The work environment involves moderate risks or\ndiscomforts which require special safety precautions, e.g. working with risk of exposure of contagious disease,\nradiation or infection, working with emotionally disturbed patients. Precautions are routine for nearly all\nsituations. The employee might be required to use protective clothing or gear.\n\nBlood Borne Pathogens\n\nCategory I - Tasks that involve exposure to blood, body fluids, or tissues\n\nThese principles apply to ALL employees:\n\nSHC Commitment to Providing an Exceptional Patient & Family Experience\n\nStanford Health Care sets a high standard for delivering value and an exceptional experience for our patients and families. Candidates for employment and existing employees must adopt and execute C-I-CARE standards for all of patients, families and towards each other. C-I-CARE is the foundation of Stanford’s patient-experience and represents a framework for patient-centered interactions. Simply put, we do what it takes to enable and empower patients and families to focus on health, healing and recovery.\n\nYou will do this by executing against our three experience pillars, from the patient and family’s perspective:\n\nKnow Me: Anticipate my needs and status to deliver effective care\nShow Me the Way: Guide and prompt my actions to arrive at better outcomes and better health\nCoordinate for Me: Own the complexity of my care through coordination\n\nEqual Opportunity Employer Stanford Health Care (SHC) strongly values diversity and is committed to equal opportunity and non-discrimination in all of its policies and practices, including the area of employment. Accordingly, SHC does not discriminate against any person on the basis of race, color, sex, sexual orientation or gender identity and/or expression, religion, age, national or ethnic origin, political beliefs, marital status, medical condition, genetic information, veteran status, or disability, or the perception of any of the above. People of all genders, members of all racial and ethnic groups, people with disabilities, and veterans are encouraged to apply. Qualified applicants with criminal convictions will be considered after an individualized assessment of the conviction and the job requirements.\n\nBase Pay Scale: Generally starting at $96.35 - $111.14 per hour\n\nThe salary of the finalist selected for this role will be set based on a variety of factors, including but not limited to, internal equity, experience, education, specialty and training. This pay scale is not a promise of a particular wage.", "has_role_fields": true, "auto": {"category": "job", "role_type": "clinical nurse (RN)", "seniority": "mid", "engagement_type": "full_time", "role_category": "other", "industry": "health_general", "remote_type": "bay_area", "company_stage": "public", "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 14, "dbid": 27459, "bucket": "Job", "title": "Senior Robotics Software Engineer, Maritime", "source": "greenhouse", "location": "Costa Mesa, California, United States", "url": "https://boards.greenhouse.io/andurilindustries/jobs/5051589007?gh_jid=5051589007", "raw": "Anduril Industries is a defense technology company with a mission to transform U.S. and allied military capabilities with advanced technology. By bringing the expertise, technology, and business model of the 21st century’s most innovative companies to the defense industry, Anduril is changing how military systems are designed, built and sold. Anduril’s family of systems is powered by Lattice OS, an AI-powered operating system that turns thousands of data streams into a realtime, 3D command and control center. As the world enters an era of strategic competition, Anduril is committed to bringing cutting-edge autonomy, AI, computer vision, sensor fusion, and networking technology to the military in months, not years.\nABOUT THE TEAM\n\nAnduril’s Maritime Division has assembled a diverse team of experts in software, robotics, artificial intelligence, sensor fusion, and data analysis to create software and hardware solutions that radically evolve the capabilities of our customers. We are fielding the next generation of autonomous systems to tackle the extremely challenging industry demands of maritime operations. Anduril has brought to market a unique, ultra-long-range, full-ocean-depth underwater vessel platform and a completely refreshed maritime vehicle and flexible manufacturing architecture that scales from \"small\" to \"extra-large\" vehicle sizes. Today, Anduril is executing on billion-dollar contracts while simultaneously performing Robot-as-a-Service (RaaS) AUV operations.\nWe are seeking to sustain our early successes with deep investment in an expanded product portfolio. These products, including Dive-XL, Dive-LD, Copperhead, Seabed Sentry, and other unannounced systems, will deliver a coherent system-of-systems, enabling the end-to-end conduct of a variety of autonomous missions in the maritime domain. If you are passionate about solving problems that have real impact and working on systems that directly contribute to achieving national strategic priorities, we want you to join Anduril’s Maritime Division and help us build the future of defense capability.\n\nABOUT THE JOB\n\nSenior Robotics Engineers independently drive delivery of vehicle perception and planning capability integrated in to our products. This includes systems analysis, sensor selection and integration, perception architecture and implementation, motion planning, health management, behaviour analysis, simulation and test infrastructure, and interfaces with lower- and higher-level systems. We expect Senior Robotics Engineers to demonstrate end-to-end outcome ownership at the major subsystem or system level. Senior Software Engineers contribute as a technical lead to the rapid architecting, design, delivery, support, and evolution of next generation autonomous plat
