ut AI to work *in* your business, or build a brand-new AI service offering *as* your business, this is the on-ramp.\n\n**Three ways this pays off:**\n**1\\. Use the certificate to pivot into a career as an AI Professional\\.**\nWhether you are mid-career or a fresh graduate, this certificate tells potential employers that you know how to leverage AI to increase your productivity - and that you care enough to invest in your own education.\n\n**2\\. Use AI to run your business better\\.**\nWalk away knowing how to use Gemini, NotebookLM, and AI Studio for the stuff that eats your week: research, content, data, planning, communications. Real prompts and workflows you'll use the next morning — not theory.\n\n**3\\. Turn it into a new offering for your business\\.**\nThe Google name carries real weight on a profile. If you choose to get the official certificate, you have a credible, recognizable badge to anchor an AI-consulting service: helping other business owners do what you just learned. We've watched this exact path work for people in our other AI sessions; this is the structured, certified version of it.\n\n**What you'll walk away with:**\n\n* Google's AI Professional Certificate (free from Google Skills or paid through Coursera membership)\n* Full fluency with the Google AI Professional curriculum\n* A portfolio: research hub, content assets, a data project, a working AI-built app\n* Real workflows for your own business, or a packaged offering to sell to others\n* 7 weeks of momentum instead of a free course that sits half-finished\n\n**The format:**\n\n* 🗓️ Every week for 7 weeks: 1 to 3 hours per week\n* 🕙 10:00 AM EDT \\| 3:00 PM BST \\| 7:30 PM IST\n* 💻 Live walkthrough + Q&A, work alongside the group\n* 🆓 100% free — Google's course, free Meetup, just show up\n\n**Who this is for:**\n• New grads and mid-career professionals who want to pivot into a career as an AI Professional.\n• Business owners (or recent grads) curious about AI who haven't found the time to dive in solo,\n• Business owners who see AI consulting as their next revenue line. No coding background needed. No prior AI experience needed.\n\n**Group accountability beats solo procrastination. Every time. Let's learn together.**\n\n***Note: This event is being shared across multiple groups, including AI student groups - we're expecting a mix of attendees at various levels in their careers. Get Google Certified with the July/August 2026 AI Professionals Network cohort.***", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": "ai_education", "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": null, "tag_confidence": 0.92, "content_quality": 8.5}}, {"seq": 32, "dbid": 7412, "bucket": "Event", "title": "July 10 - Best of CVPR (Day 3)", "source": "meetup", "location": "Online", "url": "https://www.meetup.com/san-francisco-frontier-tech-meetup/events/314912175/", "raw": "Welcome to the Best of CVPR series — your virtual front row to groundbreaking research, insights, and innovations from one of computer vision's premier conferences. Live from the authors to you.\n\n**Date, Time and Location**\n\nJul 10, 2026\n9 AM - 11 AM PT\nOnline. **[Register for Zoom!](https://voxel51.com/events/best-of-cvpr-july-10-2026)**\n\n**Advancing Generative Quality and Reasoning in Multimodal AI**\n\nThis talk exposes hidden limitations of frontier multimodal models across reasoning and visual generation, demonstrates the inherent brittleness of VLMs and audio-visual MLLMs, and introduces simple yet effective techniques to build robustness. It also covers human-centric metrics for perceptually accurate evaluation of generative media.\n\n*About the Speaker*\n\n[Deepti Ghadiyaram](https://www.linkedin.com/in/deeptigp/) is an Assistant Professor of Computer Science at Boston University. Her research focuses on building safe, interpretable, and robust computer vision systems with advanced reasoning capabilities. Before joining BU she was at Runway and Meta AI, and earned her PhD from UT Austin in 2017.\n\n**HyperRealm: Hyperbolic Vision Language Models for Real-World Hierarchical Multimodal Understanding**\n\nReal-world multimodal data naturally exhibits hierarchical structure, yet standard VLMs like CLIP align images and text in Euclidean space, which cannot preserve tree-like hierarchies. HyperRealm embeds images and text in a Poincaré ball to encode hierarchical relationships, introducing an adaptive entropy-driven entailment loss. Evaluated on 18 zero-shot classification benchmarks, it shows consistent improvements over Euclidean CLIP baselines.\n\n*About the Speaker*\n\n[Kathy Wu](https://www.linkedin.com/in/kathy-wu-ph-d-a8155563/) holds a Ph.D. in Applied Mathematics from USC. She is currently an Applied Scientist at Amazon within the Global Store organization, leading projects in e-commerce recommendation, multimodal VLMs, and LLM/GenAI applications. Her research has been published at ICCV, CVPR, ICLR, SIGIR, and WACV.\n\n**Cross-Modal Domain Adaptation using Semantic Parametric Mapping**\n\nXD-MAP is a framework that transfers semantic knowledge from image datasets to LiDAR by constructing semantic parametric maps from monocular detections and geometric priors. Unlike previous approaches, XD-MAP does not require overlapping sensor views and enables scalable 360° supervision for LiDAR perception without manual annotation.\n\n*About the Speaker*\n\n[Frank Bieder](https://www.linkedin.com/in/franklynjey/) is a researcher in computer vision and autonomous systems, leading the Visual and Spatial Learning group at FZI Research Center for Information Technology. His research covers multimodal perception, map-based learning, and cross-sensor domain adaptation for autonomous driving. He received his Ph.D. from KIT in 2026.\n\n**WalkGPT: Pixel-Grounded Navigation Guidance for Pedestrians**\n\nPedestrian navigation requires more than generic scene description; users need to understand walkable areas, obstacles, and the distance of surrounding objects. In this talk, I will present WalkGPT, a grounded vision-language model for accessibility-aware pedestrian navigation. WalkGPT connects language reasoning with segmentation masks and object-level distance estimates to generate grounded navigation guidance from pedestrian-view images. I will also introduce PAVE, a 41k-sample benchmark for depth-aware accessibility reasoning in real pedestrian environments. The talk will highlight how grounded multimodal AI can support safer and more interpretable pedestrian assistance.\n\n*About the Speaker*\n\n[Rafi Ibn Sultan](https://www.linkedin.com/in/rafi-ibn-sultan/) is a Ph.D. researcher in Computer Science at Wayne State University, working on computer vision, multimodal AI, and vision-language models. His research focuses on grounded and interpretable AI systems for real-world visual reasoning, including pedestrian navigation and medical image segmentation. His recent work includes WalkGPT, accepted at CVPR 2026, and GeoSAM, accepted at ECAI 2025.", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category": null, "industry": null, "remote_type": "unknown", "company_stage": null, "spam_risk": "clean", "deadline": "2026-07-10", "tag_confidence": 0.95, "content_quality": 8.5}}, {"seq": 33, "dbid": 7415, "bucket": "Event", "title": "R Data Science Accelerator: 1 Day Workshop in San Francisco, CA", "source": "eventbrite", "location": "San Francisco, CA", "url": "https://www.eventbrite.sg/e/r-data-science-accelerator-1-day-workshop-in-san-francisco-ca-tickets-1979201561148", "raw": "Master essential R workflows, analytics, and visualizations in one power-packed 1 Day data science workshop.", "has_role_fields": false, "auto": {"category": "event", "role_type": null, "seniority": "n/a", "engagement_type": null, "role_category   // Collect match spans across all patterns, then merge/render without overlap conflicts.
  const spans = [];
  HIGHLIGHT_PATTERNS.forEach(p => {
    let m;
    const re = new RegExp(p.re.source, p.re.flags);
    while ((m = re.exec(raw)) !== null) {
      spans.push({ start: m.index, end: m.index + m[0].length, cls: p.cls });
      if (m.index === re.lastIndex) re.lastIndex++;
    }
  });
  spans.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  // drop spans that start inside an already-accepted span (avoid nested/overlap markup)
  const accepted = [];
  let cursor = 0;
  spans.forEach(s => {
    if (s.start >= cursor) {
      accepted.push(s);
      cursor = s.end;
    }
  });
  let out = '';
  let pos = 0;
  accepted.forEach(s => {
    out += escapeHtml(raw.slice(pos, s.start));
    out += '<mark class="' + s.cls + '">' + escapeHtml(raw.slice(s.start, s.end)) + '</mark>';
    pos = s.end;
  });
  out += escapeHtml(raw.slice(pos));
  return out;
}

function loadAnswers() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveAnswers(a) { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }

let answers = loadAnswers();
let idx = 0;

const jumpTo = document.getElementById('jumpTo');
ITEMS.forEach((it, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = it.seq + '. [' + it.bucket + '] ' + it.title.slice(0,50);
  jumpTo.appendChild(opt);
});
jumpTo.addEventListener('change', () => { idx = parseInt(jumpTo.value, 10); render(); });

function currentAnswer() {
  const it = ITEMS[idx];
  if (!answers[it.dbid]) answers[it.dbid] = {};
  return answers[it.dbid];
}

function updateProgress() {
  const done = ITEMS.filter(it => {
    const a = answers[it.dbid];
    return a && a.category;
  }).length;
  document.getElementById('progress').textContent = done + ' / ' + ITEMS.length + ' labeled';
}

function makeButtonGroup(containerId, options, fieldName) {
  const div = document.getElementById(containerId);
  div.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.textContent = opt;
    btn.dataset.value = opt;
    btn.addEventListener('click', () => {
      const a = currentAnswer();
      a[fieldName] = (a[fieldName] === opt) ? '' : opt; // toggle off if clicked again
      answers[ITEMS[idx].dbid] = a;
      saveAnswers(answers);
      refreshButtonGroup(containerId, a[fieldName]);
      updateProgress();
    });
    div.appendChild(btn);
  });
}

function refreshButtonGroup(containerId, selectedValue) {
  const div = document.getElementById(containerId);
  Array.from(div.children).forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.value === selectedValue);
  });
}

function render() {
  const it = ITEMS[idx];
  jumpTo.value = idx;
  document.getElementById('bucketTag').textContent = it.bucket + ' · item ' + it.seq + ' of ' + ITEMS.length;
  document.getElementById('itemTitle').textContent = it.title;
  document.getElementById('itemMeta').innerHTML =
    'Source: <b>' + it.source + '</b> &nbsp;|&nbsp; Location: ' + it.location + ' &nbsp;|&nbsp; DB id: ' + it.dbid + '<br>' +
    '<a href="' + it.url + '" target="_blank" rel="noopener">' + it.url + '</a>';
  document.getElementById('legend').innerHTML =
    '<span><span class="swatch" style="background:var(--mk-seniority)"></span>seniority cue</span>' +
    '<span><span class="swatch" style="background:var(--mk-engagement)"></span>engagement cue</span>' +
    '<span><span class="swatch" style="background:var(--mk-remote)"></span>location/remote cue</span>';
  document.getElementById('itemRaw').innerHTML = highlight(it.raw);

  makeButtonGroup('categoryButtons', CATEGORY_OPTS, 'category');
  makeButtonGroup('remoteTypeButtons', REMOTE_TYPE_OPTS, 'remote_type');
  makeButtonGroup('correctButtons', CORRECT_OPTS, 'correct');

  const jobFieldsDiv = document.getElementById('jobFields');
  if (it.has_role_fields) {
    jobFieldsDiv.innerHTML =
      '<div class="field"><label>role_type</label><input type="text" id="roleType"></div>' +
      '<div class="field"><label>seniority</label><div class="btn-group" id="seniorityButtons"></div></div>' +
      '<div class="field"><label>engagement_type</label><div class="btn-group" id="engagementButtons"></div></div>';
    makeButtonGroup('seniorityButtons', SENIORITY_OPTS, 'seniority');
    makeButtonGroup('engagementButtons', ENGAGEMENT_OPTS, 'engagement_type');
  } else {
    jobFieldsDiv.innerHTML = '';
  }

  const autoBody = document.getElementById('autoTagBody');
  autoBody.innerHTML = Object.entries(it.auto).map(([k,v]) => '<code>' + k + '</code>: <code>' + v + '</code>').join(' &nbsp;|&nbsp; ');

  const a = currentAnswer();
  refreshButtonGroup('categoryButtons', a.category);
  refreshButtonGroup('remoteTypeButtons', a.remote_type);
  refreshButtonGroup('correctButtons', a.correct);
  if (it.has_role_fields) {
    document.getElementById('roleType').value = a.role_type || '';
    refreshButtonGroup('seniorityButtons', a.seniority);
    refreshButtonGroup('engagementButtons', a.engagement_type);
  }
  document.getElementById('notes').value = a.notes || '';

  updateProgress();
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'roleType' || e.target.id === 'notes') {
    const it = ITEMS[idx];
    const a = currentAnswer();
    if (e.target.id === 'roleType') a.role_type = e.target.value;
    if (e.target.id === 'notes') a.notes = e.target.value;
    answers[it.dbid] = a;
    saveAnswers(answers);
  }
});

document.getElementById('prevBtn').addEventListener('click', () => {
  idx = Math.max(0, idx - 1);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  idx = Math.min(ITEMS.length - 1, idx + 1);
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = ITEMS.map(it => Object.assign({seq: it.seq, dbid: it.dbid, bucket: it.bucket, title: it.title}, answers[it.dbid] || {}));
  const blob = new Blob([JSON.stringify(rows, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'eval_answers.json';
  a.click();
});

document.getElementById('exportCsvBtn').addEventListener('click', () => {
  const cols = ['seq','dbid','bucket','title','category','role_type','seniority','engagement_type','remote_type','correct','notes'];
  const lines = [cols.join(',')];
  ITEMS.forEach(it => {
    const a = answers[it.dbid] || {};
    const row = cols.map(c => {
      let v;
      if (c === 'seq') v = it.seq;
      else if (c === 'dbid') v = it.dbid;
      else if (c === 'bucket') v = it.bucket;
      else if (c === 'title') v = it.title;
      else v = a[c] || '';
      v = String(v).replace(/"/g, '""');
      return '"' + v + '"';
    });
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const a2 = document.createElement('a');
  a2.href = URL.createObjectURL(blob);
  a2.download = 'eval_answers.csv';
  a2.click();
});

render();
</script>
</body>
</html>
